<style>
    .material-symbols-outlined { font-size: 20px; }

    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

    .toast-error { background: linear-gradient(135deg, #ba1a1a, #d32f2f); }
    .toast-warning { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .toast-info { background: linear-gradient(135deg, #0284c7, #00AAFF); }
    @media (max-width: 1023px) { .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s ease; } .sidebar-desktop.open { transform: translateX(0); } .main-content { margin-left: 0 !important; } .overlay { display: none; } .overlay.active { display: block; } }
    .mp-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .mp-card { background: #fff; border-radius: 24px; padding: 22px; box-shadow: 0 0 0 1px #E4E4E7; }

    .mp-plan { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

    .mp-fecha { margin-top: 6px; color: #52525B; font-size: 14px; }
    .mp-uso { margin-top: 18px; display: grid; gap: 14px; }
    .mp-uso div > span { display: flex; justify-content: space-between; font-size: 14px; color: #3F3F46; }
    .mp-uso div > span b { font-weight: 600; color: #18181B; font-variant-numeric: tabular-nums; }
    .mp-bar { margin-top: 6px; height: 8px; border-radius: 8px; background: var(--rubro-suave, #E6F6FF); overflow: hidden; }
    .mp-bar i { display: block; height: 100%; background: var(--rubro-acento, #00AAFF); border-radius: 8px; }

    .mp-planes { display: grid; gap: 10px; margin-top: 12px; }

    @media (max-width: 900px) { .mp-grid { grid-template-columns: 1fr; } .mp-op { flex-wrap: wrap; } }

<script>

var U = nk.boot();
var $ = function (id) { return document.getElementById(id); };
var ESTADO = { prueba: ['En prueba', 'nk-b-blue'], activa: ['Activa', 'nk-b-green'], vencida: ['Vencida', 'nk-b-amber'], bloqueada: ['Suspendida', 'nk-b-red'] };
function f(d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString('es-VE', { day: 'numeric', month: 'long', year: 'numeric' }) : '—'; }
function barra(lbl, usado, max) {
    var pct = max ? Math.min(100, Math.round(usado / max * 100)) : 8;
    return '<div><span>' + lbl + '<b>' + nk.num(usado, 0) + (max == null ? ' · sin límite' : ' de ' + nk.num(max, 0)) + '</b></span><div class="mp-bar"><i style="width:' + pct + '%"' + (max && pct >= 90 ? ' class="lleno"' : '') + '></i></div></div>';
}
function precio(p) { return p.precio_usd_mes == null ? 'Precio a convenir' : '$' + nk.num(p.precio_usd_mes) + ' / mes'; }
function limites(p) {
    var t = p.max_sucursales == null ? 'tiendas sin límite' : (p.max_sucursales === 0 ? '1 tienda' : (p.max_sucursales + 1) + ' tiendas');
    var u = p.max_usuarios == null ? 'usuarios sin límite' : p.max_usuarios + ' usuarios';
    return t + ' · ' + u;
}
async function cargar() {
    if (window.RefEmpresa.esPrincipal()) {
        $('mp-cont').innerHTML = '<div class="mp-card"><h2>Plan interno</h2><p class="mp-fecha">Esta es la empresa principal de la plataforma: no tiene límites ni vencimiento.</p></div>';
        return;
    }
    var s = await window.RefEmpresa.suscripcion();
    var pr = await window.refPlataforma().rpc('saas_producto');
    if (!s) { $('mp-cont').innerHTML = '<div class="mp-card">No se pudo cargar tu plan. Revisa tu conexión y vuelve a intentar.</div>'; return; }
    var prod = (pr && pr.data) || {};
    var est = ESTADO[s.estado] || [s.estado, 'nk-b-gray'];
    var fecha = s.estado === 'prueba' ? 'Prueba gratis hasta el ' + f(s.prueba_hasta) : (s.pagado_hasta ? 'Pagado hasta el ' + f(s.pagado_hasta) : '');
    if (s.estado === 'vencida') fecha = 'Venció. Puedes consultar todo, pero para vender y registrar operaciones renueva tu plan.';
    var wa = (prod.whatsapp || s.whatsapp || (window.REF_PRODUCTO || {}).whatsapp || '').replace(/\D/g, '');
    function enlace(plan) {
        var t = 'Hola, soy de ' + s.empresa + ' (código ' + s.slug + ') y quiero ' + (plan ? 'el plan ' + plan : 'renovar mi plan') + ' de ' + (prod.nombre || s.producto) + '.';
        return wa ? 'https://wa.me/' + wa + '?text=' + encodeURIComponent(t) : 'mailto:' + encodeURIComponent(prod.correo || (window.REF_PRODUCTO || {}).correo || '') + '?subject=' + encodeURIComponent('Plan ' + (plan || '')) + '&body=' + encodeURIComponent(t);
    }
    var planes = (prod.planes || []).map(function (p) {
        var actual = p.id === s.plan_id;
        return '<div class="mp-op' + (actual ? ' actual' : '') + '"><div><b>' + nk.esc(p.nombre) + (actual ? ' · tu plan' : '') + '</b><small>' + nk.esc(p.descripcion || limites(p)) + '</small></div>' +
            '<span class="p">' + nk.esc(precio(p)) + '</span>' +
            '<a class="nk-btn ' + (actual ? '' : 'nk-btn-outline') + '" href="' + enlace(p.nombre) + '" target="_blank" rel="noopener">' + (actual ? (s.estado === 'prueba' ? 'Activar' : 'Renovar') : 'Cambiar a este') + '</a></div>';
    }).join('');
    $('mp-cont').innerHTML = '<div class="mp-grid"><section class="mp-card"><h2>Tu suscripción</h2>' +
        '<div class="mp-plan"><b>' + nk.esc(s.plan) + '</b><span class="nk-badge ' + est[1] + '">' + est[0] + '</span></div>' +
        '<p class="mp-fecha">' + nk.esc(fecha) + '</p>' +
        '<div class="mp-uso">' + barra('Colaboradores', s.uso.usuarios, s.limites.usuarios) +
        barra('Tiendas adicionales', s.uso.sucursales, s.limites.sucursales) + barra('Productos', s.uso.productos, s.limites.productos) + '</div>' +
        '<p class="mp-nota">Código de tu empresa: <b>' + nk.esc(s.slug) + '</b>. Tu equipo entra en <b>' + nk.esc(location.origin + '/login.html?empresa=' + s.slug) + '</b></p></section>' +
        '<section class="mp-card"><h2>Planes</h2><div class="mp-planes">' + (planes || '<p class="mp-fecha">Escríbenos para ver los planes.</p>') + '</div>' +
        '<p class="mp-nota">El pago se confirma a mano: al escribirnos te indicamos cómo pagar y activamos tu plan el mismo día.</p></section></div>';
}
cargar();

</script>
<script src="quick-actions.js"></script>
<script src="js/ui-animations.js"></script>
