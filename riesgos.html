    tailwind.config = { theme: { extend: { colors: { "primary-container": "#00AAFF", "on-primary-container": "#ffffff", "primary": "#0090D9", "secondary": "#3f3f46", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f6f6", "surface-container": "#eceef0", "surface-container-high": "#e6e8ea", "surface-container-highest": "#e0e3e5", "surface": "#ffffff", "background": "#efefef", "on-background": "#191c1e", "on-surface-variant": "#52525b", "outline-variant": "#e4e4e7", "error": "#ba1a1a", "on-error": "#ffffff" }, spacing: { base: "4px", xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "48px", gutter: "20px" } } } }
</script>
<link rel="stylesheet" href="css/design-system.css"/>
<style>
    .material-symbols-outlined { font-size: 20px; }
    .hidden-modal { display: none !important; }
    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 20px; border-radius: 14px; color: white; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 380px; }
    .toast-error { background: linear-gradient(135deg, #ba1a1a, #d32f2f); }
    .toast-warning { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .toast-info { background: linear-gradient(135deg, #0284c7, #00AAFF); }
    .rg-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
    @media (min-width: 1100px) { .rg-cards.dos { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
    .rg-cards h2 { font-family: Poppins, sans-serif; font-size: 16px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .rg-cards .nt-item { padding: 10px 0; }
    #rg-texto { white-space: pre-wrap; font: 13.5px/1.55 Inter, system-ui, sans-serif; background: #F6F7F9; border-radius: 14px; padding: 14px 16px; margin: 0; max-height: 360px; overflow: auto; }
    .rg-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    @media (max-width: 1023px) { .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s ease; } .sidebar-desktop.open { transform: translateX(0); } .main-content { margin-left: 0 !important; } .overlay { display: none; } .overlay.active { display: block; } }

</style>

<body class="bg-background text-on-background min-h-screen">
<div id="toast-container" class="toast-container"></div>
<div id="sidebar-overlay" class="overlay fixed inset-0 bg-black/50 z-30 lg:hidden" onclick="toggleSidebar()"></div>
<button onclick="toggleSidebar()" class="fixed top-4 left-4 z-50 lg:hidden bg-primary text-white p-2 rounded-lg shadow-lg"><span class="material-symbols-outlined">menu</span></button>
<div data-sucursal-badge-mobile class="fixed top-4 right-4 z-50 lg:hidden"></div>
<div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar-desktop fixed left-0 top-0 h-screen w-[280px] bg-surface flex flex-col p-md gap-sm z-40 lg:translate-x-0">
        <div class="mb-lg px-sm flex items-center justify-between">
            <div>
                <div class="text-2xl font-black text-primary tracking-tighter">REFRIMAR</div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-on-surface-variant"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div id="user-badge" class="hidden-modal"><div id="user-name">-</div><div id="user-rol">-</div></div>
        <div data-sucursal-badge class="mx-sm mb-2"></div>
        <nav class="flex flex-col gap-xs flex-1 overflow-y-auto"></nav>
        <div class="mx-sm my-2 h-px bg-outline-variant/40 shrink-0"></div>
        <button id="logout-btn" class="w-full py-3 rounded-lg flex items-center gap-2 text-sm"><span class="material-symbols-outlined">logout</span>Cerrar sesión</button>
    </aside>
    <main class="flex-1 ml-[280px] lg:ml-[280px] main-content p-4 md:p-lg min-w-0">
        <header class="hidden"><h1>Riesgos</h1></header>
        <div class="nk-page-head">
            <div><h1>Riesgos</h1><p>Lo que puede estar costando dinero: alertas del día, productos que se venden a pérdida, stock negativo, productos sin precio y facturas de proveedor repetidas.</p></div>
            <div class="nk-actions"><button id="rg-actualizar" class="nk-btn nk-btn-ghost" type="button">Actualizar<span class="material-symbols-outlined">refresh</span></button></div>
        </div>
        <div class="rg-cards" id="rg-cards">
            <section class="pf-card" id="rg-alertas"><h2>Alertas de hoy</h2><div id="rg-al-lista"></div></section>
            <section class="pf-card" id="rg-resumen" hidden>
                <h2>Resumen del día <span class="nk-hint" style="font-weight:400;font-size:13px">Llega a tu WhatsApp a las 6:00 pm</span></h2>
                <pre id="rg-texto">Cargando…</pre>
                <div class="rg-acc">
                    <button type="button" class="nk-btn nk-btn-sm" id="rg-enviar"><span class="material-symbols-outlined">send</span>Enviar a mi WhatsApp</button>
                    <a class="nk-btn nk-btn-outline nk-btn-sm" id="rg-compartir" target="_blank" rel="noopener" href="#"><span class="material-symbols-outlined">share</span>Compartir</a>
                    <button type="button" class="nk-btn nk-btn-ghost nk-btn-sm" id="rg-copiar"><span class="material-symbols-outlined">content_copy</span>Copiar</button>
                </div>
            </section>
        </div>
        <section id="rg-tabla"></section>
    </main>
</div>
<script src="supabase-config.js"></script>
<script src="js/empresa.js"></script>
<script src="auth-session.js"></script>
<script src="sucursal-selector.js"></script>
<script src="offline-manager.js"></script>
<script src="js/nk-ui.js"></script>
<script>
var U = nk.boot();
var $ = function (id) { return document.getElementById(id); };
var TIPOS = {
    perdida: ['A pérdida', 'trending_down', 'Se vende por debajo del costo'],
    negativo: ['Stock negativo', 'remove_shopping_cart', 'Se vendió más de lo que había'],
    sin_precio: ['Sin precio', 'sell', 'No se puede vender hasta ponerle precio'],
    factura: ['Facturas repetidas', 'content_copy', 'La misma factura está cargada más de una vez'],
    diferencia: ['Diferencias con la orden', 'difference', 'La factura no coincide con lo pedido']
};
function enlaceProducto(cod) { return '<a style="color:var(--rubro-oscuro,#0090D9);font-weight:500" href="producto-form.html?codigo=' + encodeURIComponent(cod) + '">Corregir</a>'; }
var T = nk.table({
    el: '#rg-tabla',
    placeholder: 'Buscar producto, código o proveedor',
    tabs: Object.keys(TIPOS).map(function (k) { return { key: k, label: TIPOS[k][0], icon: TIPOS[k][1], test: function (r) { return r.tipo === k; } }; }),
    search: function (r) { return [r.nombre, r.codigo, r.detalle].join(' '); },
    columns: [
        { label: 'Producto o factura', render: function (r) { return '<b style="font-weight:500">' + nk.esc(r.nombre) + '</b><span class="nk-sub">' + nk.esc(r.codigo || '') + '</span>'; } },
        { label: 'Qué pasa', render: function (r) { return nk.esc(r.detalle); } },
        { label: '', cls: 'text-right', render: function (r) { return r.accion || ''; } }
    ],
    empty: { tipo: 'exito', title: 'Nada por aquí', sub: 'No hay riesgos de este tipo.' },
    pageSize: 25
});
function filas(d) {
    var f = [];
    (d.margen_negativo || []).forEach(function (p) {
        f.push({ tipo: 'perdida', nombre: p.descripcion, codigo: p.codigo, accion: enlaceProducto(p.codigo),
                 detalle: 'Costo ' + nk.usd(p.costo) + ' · precio sin IVA ' + nk.usd(p.precio_sin_iva) + ' · pierdes ' + nk.usd(Number(p.costo) - Number(p.precio_sin_iva)) + ' por unidad' });
    });
    (d.stock_negativo || []).forEach(function (p) {
        f.push({ tipo: 'negativo', nombre: p.descripcion, codigo: p.codigo, accion: '<a style="color:var(--rubro-oscuro,#0090D9);font-weight:500" href="kardex.html?codigo=' + encodeURIComponent(p.codigo) + '">Ver kardex</a>',
                 detalle: p.tienda + ': ' + nk.qty(p.stock) + ' — cuéntalo y ajusta' });
    });
    (d.sin_precio || []).forEach(function (p) {
        f.push({ tipo: 'sin_precio', nombre: p.descripcion, codigo: p.codigo, accion: enlaceProducto(p.codigo),
                 detalle: 'Stock ' + nk.qty(p.stock) + ' · la caja no lo deja vender' });
    });
    (d.facturas_repetidas || []).forEach(function (x) {
        f.push({ tipo: 'factura', nombre: x.proveedor, codigo: 'Factura ' + x.numero, accion: '<a style="color:var(--rubro-oscuro,#0090D9);font-weight:500" href="cuentas_por_pagar.html">Revisar</a>',
                 detalle: 'Cargada ' + x.veces + ' veces · ' + nk.usd(x.monto_usd) + ' en total' });
    });
    (d.facturas_diferencias || []).forEach(function (x) {
        var resumen = (x.diferencias || []).map(function (y) {
            return (y.descripcion || y.codigo) + ': ' + y.detalle + (y.tipo === 'precio' ? ' (' + nk.usd(y.costo_orden) + ' → ' + nk.usd(y.costo_factura) + ')' : y.tipo === 'de_mas' ? ' (pedido ' + nk.qty(y.pedido) + ', llegó ' + nk.qty(y.facturado) + ')' : '');
        }).join(' · ');
        f.push({ tipo: 'diferencia', nombre: x.proveedor + ' · Factura ' + x.numero, codigo: nk.fecha(x.fecha) + ' · ' + nk.usd(x.monto) + ' en diferencias',
                 accion: '<button type="button" class="nk-btn nk-btn-ghost nk-btn-sm" data-revisar="' + nk.esc(x.id) + '">Ya la revisé</button>', detalle: resumen });
    });
    return f;
}
async function cargar() {
    T.setLoading();
    var r = await supabaseClient.rpc('riesgos_resumen');
    if (r.error) {
        var m = /PGRST202|Could not find the function|schema cache/i.test((r.error.code || '') + ' ' + (r.error.message || ''))
            ? 'Falta actualizar la base de datos: corre en Supabase el archivo REFRIMAR-SQL-17-noviembre-2026-etapa2.sql' : nk.errMsg(r.error);
        T.setRows([]); nk.toast(m, 'error'); return;
    }
    var d = r.data || {};
    var lista = filas(d);
    T.setRows(lista);
    document.querySelectorAll('#rg-tabla .nk-tab').forEach(function (b) {
        var n = lista.filter(function (x) { return x.tipo === b.dataset.tab; }).length;
        var c = b.querySelector('.nk-tab-count'); if (c) c.textContent = n ? ' ' + n : '';
        if (b.dataset.tab === 'perdida' && d.ver_costos === false) b.hidden = true;
    });
    // riesgos.html#negativo (desde una alerta): abre esa pestaña
    var h = location.hash.slice(1), tb = h && document.querySelector('#rg-tabla .nk-tab[data-tab="' + h + '"]');
    if (tb && !tb.hidden && !tb.classList.contains('on')) { tb.click(); tb.scrollIntoView({ block: 'nearest' }); }
}
// ---------- Alertas (las mismas de la campana) ----------
var ICO = { alta: 'error', media: 'warning', baja: 'info' };
async function cargarAlertas() {
    var box = $('rg-al-lista');
    var r = await supabaseClient.rpc('alertas_resumen');
    if (r.error) { box.innerHTML = '<p class="nk-hint">' + nk.esc(/PGRST202|Could not find the function|schema cache/i.test((r.error.code || '') + ' ' + (r.error.message || '')) ? 'Para ver las alertas corre en Supabase el archivo REFRIMAR-SQL-17-noviembre-2026-etapa3.sql' : nk.errMsg(r.error)) + '</p>'; return; }
    var l = (r.data || []).slice().sort(function (a, b) { return ({ alta: 0, media: 1, baja: 2 })[a.nivel] - ({ alta: 0, media: 1, baja: 2 })[b.nivel]; });
    box.innerHTML = l.length ? l.map(function (a) {
        return '<div class="nt-item al-' + nk.esc(a.nivel) + '"><span class="nt-ic"><span class="material-symbols-outlined">' + (ICO[a.nivel] || 'warning') + '</span></span>' +
            '<a class="nt-main" href="' + nk.esc(a.href || '#') + '"><b>' + nk.esc(a.titulo) + '</b><span>' + nk.esc(a.detalle || '') + '</span></a></div>';
    }).join('') : window.refEstado('exito', 'Todo en orden', 'No hay alertas por ahora.', '', 'xs');
}
// ---------- Resumen del día (solo administrador) ----------
var TEXTO = '';
async function cargarResumen() {
    var u = window.getSesionUsuario && window.getSesionUsuario();
    if (!u || u.rol !== 'admin') return;
    $('rg-resumen').hidden = false; $('rg-cards').classList.add('dos');
    var r = await supabaseClient.rpc('resumen_diario');
    if (r.error) { $('rg-texto').textContent = /PGRST202|Could not find the function|schema cache/i.test((r.error.code || '') + ' ' + (r.error.message || '')) ? 'Corre en Supabase el archivo REFRIMAR-SQL-17-noviembre-2026-etapa3.sql' : nk.errMsg(r.error); return; }
    TEXTO = (r.data && r.data.texto) || '';
    $('rg-texto').textContent = TEXTO;
    $('rg-compartir').href = 'https://wa.me/?text=' + encodeURIComponent(TEXTO);
}
$('rg-copiar').addEventListener('click', function () {
    if (!TEXTO) return;
    try { navigator.clipboard.writeText(TEXTO).then(function () { nk.toast('Resumen copiado', 'success'); }, function () { nk.toast('No se pudo copiar', 'error'); }); } catch (e) { nk.toast('No se pudo copiar', 'error'); }
});
$('rg-enviar').addEventListener('click', function () {
    var b = this;
    nk.busy(b, async function () {
        try {
            var res = await fetch('/api/resumen-diario', { method: 'POST', headers: window.refCabecerasApi ? window.refCabecerasApi() : { 'Content-Type': 'application/json' }, body: '{}' });
            var j = await res.json().catch(function () { return {}; });
            if (res.ok && j.ok) nk.toast('Resumen enviado a tu WhatsApp', 'success');
            else nk.toast(j.error || 'No se pudo enviar. Usa "Compartir".', 'error');
        } catch (e) { nk.toast('Sin conexión. Usa "Compartir".', 'error'); }
    });
});
$('rg-actualizar').addEventListener('click', function () { cargar(); cargarAlertas(); cargarResumen(); });
$('rg-tabla').addEventListener('click', function (e) {
    var b = e.target.closest('[data-revisar]'); if (!b) return;
    nk.busy(b, async function () {
        var r = await supabaseClient.rpc('factura_diferencias_revisar', { p_id: b.dataset.revisar, p_nota: null });
        if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
        nk.toast('Listo: la factura sale de la lista', 'success'); cargar();
    });
});
if (U) { cargar(); cargarAlertas(); cargarResumen(); }
</script>
<script src="quick-actions.js"></script>
<script src="js/ui-animations.js"></script>
</body>
</html>
