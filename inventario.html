<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>REFRIMAR // Inventario</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono-data { font-family: 'JetBrains Mono', monospace; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 20px; }
    .hidden-modal { display: none !important; }
</style>
<script>
    tailwind.config = { theme: { extend: {
        colors: {
            "primary-container": "#0070f3", "on-primary-container": "#ffffff", "primary": "#0058c3",
            "surface-container-lowest": "#ffffff", "surface-container-low": "#f2f4f6", "surface-container": "#eceef0",
            "surface-container-high": "#e6e8ea", "surface": "#f7f9fb", "background": "#f7f9fb",
            "on-background": "#191c1e", "on-surface-variant": "#414754", "outline-variant": "#c1c6d7",
            "error": "#ba1a1a", "on-error": "#ffffff"
        },
        spacing: { base: "4px", xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "48px", gutter: "20px" }
    } } }
</script>
</head>
<body class="bg-background text-on-background min-h-screen">

<div class="flex min-h-screen">
    <aside class="fixed left-0 top-0 h-screen w-[280px] bg-surface/70 backdrop-blur-xl border-r border-[rgba(0,240,255,0.2)] flex flex-col p-md gap-sm z-40">
        <div class="mb-xl px-sm">
            <div class="text-2xl font-black text-primary tracking-tighter">REFRIMAR</div>
            <div class="font-mono-data text-xs text-on-surface-variant opacity-70">ADMIN TERMINAL</div>
        </div>
        <nav class="flex flex-col gap-xs flex-1">
            <a href="inventario.html" class="flex items-center gap-md px-md py-sm bg-primary-container text-on-primary-container rounded-lg font-bold border border-primary cursor-pointer">
                <span class="material-symbols-outlined">inventory_2</span><span class="font-mono-data text-sm">Inventario</span>
            </a>
            <a href="facturacion.html" class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest/50 rounded-lg transition-all cursor-pointer">
                <span class="material-symbols-outlined">receipt_long</span><span class="font-mono-data text-sm">Facturación</span>
            </a>
            <a href="carga-ia.html" class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest/50 rounded-lg transition-all cursor-pointer">
                <span class="material-symbols-outlined">neurology</span><span class="font-mono-data text-sm">Carga IA</span>
            </a>
            <a href="reportes.html" class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest/50 rounded-lg transition-all cursor-pointer">
                <span class="material-symbols-outlined">bar_chart</span><span class="font-mono-data text-sm">Reportes</span>
            </a>
        </nav>
        <button id="new-product-btn" class="w-full py-3 rounded-lg bg-gradient-to-r from-primary to-primary-container text-white font-bold font-mono-data flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
            <span class="material-symbols-outlined">add</span>Nuevo Producto
        </button>
    </aside>

    <main class="flex-1 ml-[280px] p-lg">
        <header class="flex items-center justify-between mb-lg">
            <h1 class="text-xl font-extrabold text-primary tracking-tight">REFRIMAR // INVENTARIO</h1>
            <input id="table-search" type="text" placeholder="Buscar ref, producto o categoría..." class="w-80 rounded-lg border border-outline-variant/50 px-4 py-2 text-sm outline-none focus:border-primary"/>
        </header>

        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-md mb-lg">
            <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-lg">
                <div class="text-xs text-on-surface-variant font-bold uppercase">Total Productos</div>
                <div id="kpi-total" class="font-mono-data text-3xl font-black mt-1">0</div>
            </div>
            <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-lg">
                <div class="text-xs text-on-surface-variant font-bold uppercase">Valor de Inventario</div>
                <div id="kpi-valor" class="font-mono-data text-3xl font-black mt-1 text-primary">$0.00</div>
            </div>
            <div class="bg-surface-container-lowest rounded-xl border border-error/30 p-lg">
                <div class="text-xs text-error font-bold uppercase">Stock Crítico</div>
                <div id="kpi-critico" class="font-mono-data text-3xl font-black mt-1 text-error">0</div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-surface-container-low">
                    <tr class="text-left text-xs text-on-surface-variant uppercase font-bold">
                        <th class="px-4 py-3">Ref</th><th class="px-4 py-3">Descripción</th><th class="px-4 py-3">Stock</th>
                        <th class="px-4 py-3 text-right">Costo</th><th class="px-4 py-3 text-right">Precio</th>
                        <th class="px-4 py-3">Estado</th><th class="px-4 py-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventory-body" class="divide-y divide-outline-variant/30"></tbody>
            </table>
            <div id="loading-state" class="text-center py-xl text-on-surface-variant text-sm">Cargando productos...</div>
        </div>
    </main>
</div>

<!-- ==================== MODAL: NUEVO / EDITAR PRODUCTO ==================== -->
<div id="product-modal" class="fixed inset-0 z-[100] hidden-modal items-center justify-center p-md bg-black/50 backdrop-blur-sm">
    <div class="bg-white rounded-xl w-full max-w-md p-lg shadow-2xl">
        <h3 id="modal-title" class="text-lg font-bold text-primary mb-4">Nuevo Producto</h3>
        <form id="product-form" class="space-y-3">
            <input type="hidden" id="form-id"/>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant">Código</label>
                <input id="form-codigo" required type="text" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 font-mono-data text-sm outline-none focus:border-primary"/>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant">Descripción</label>
                <input id="form-descripcion" required type="text" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 text-sm outline-none focus:border-primary"/>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold uppercase text-on-surface-variant">Categoría</label>
                    <input id="form-categoria" type="text" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 text-sm outline-none focus:border-primary"/>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase text-on-surface-variant">Marca</label>
                    <input id="form-marca" type="text" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 text-sm outline-none focus:border-primary"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold uppercase text-on-surface-variant">Costo $</label>
                    <input id="form-costo" required type="number" step="0.01" min="0" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 font-mono-data text-sm outline-none focus:border-primary"/>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase text-on-surface-variant">Precio $</label>
                    <input id="form-precio" required type="number" step="0.01" min="0" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 font-mono-data text-sm outline-none focus:border-primary"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold uppercase text-on-surface-variant">Stock</label>
                    <input id="form-stock" required type="number" min="0" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 font-mono-data text-sm outline-none focus:border-primary"/>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase text-on-surface-variant">Stock Mínimo</label>
                    <input id="form-stock-minimo" required type="number" min="0" class="mt-1 w-full rounded-md border border-outline-variant/60 px-3 py-2 font-mono-data text-sm outline-none focus:border-primary"/>
                </div>
            </div>
            <div class="flex gap-3 pt-4">
                <button type="button" id="cancel-form-btn" class="flex-1 py-2.5 rounded-lg border border-outline-variant/50 text-on-surface-variant font-bold text-sm">Cancelar</button>
                <button type="submit" class="flex-1 py-2.5 rounded-lg bg-primary text-white font-bold text-sm">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="supabase-config.js"></script>
<script>
/* ============================================================
   INVENTARIO — CRUD real sobre la tabla `productos` de Supabase
   ============================================================ */
let PRODUCTOS = [];

const inventoryBody = document.getElementById('inventory-body');
const loadingState = document.getElementById('loading-state');
const tableSearch = document.getElementById('table-search');
const productModal = document.getElementById('product-modal');
const productForm = document.getElementById('product-form');
const modalTitle = document.getElementById('modal-title');

async function loadProductos() {
    loadingState.classList.remove('hidden-modal');
    loadingState.textContent = 'Cargando productos...';
    const { data, error } = await supabaseClient.from('productos').select('*').order('descripcion');
    if (error) {
        loadingState.textContent = 'Error al conectar con Supabase. Revisa supabase-config.js.';
        console.error(error);
        return;
    }
    PRODUCTOS = data;
    loadingState.classList.add('hidden-modal');
    renderTable(PRODUCTOS);
    renderKPIs(PRODUCTOS);
}

function renderKPIs(list) {
    const total = list.length;
    const valor = list.reduce((sum, p) => sum + Number(p.costo) * p.stock, 0);
    const critico = list.filter(p => p.stock <= p.stock_minimo).length;
    document.getElementById('kpi-total').textContent = total.toLocaleString('es-VE');
    document.getElementById('kpi-valor').textContent = `$${valor.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    document.getElementById('kpi-critico').textContent = critico;
}

function estadoBadge(p) {
    if (p.stock === 0) return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-error/10 text-error">AGOTADO</span>`;
    if (p.stock <= p.stock_minimo) return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-amber-100 text-amber-700">STOCK BAJO</span>`;
    return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">STOCK ALTO</span>`;
}

function renderTable(list) {
    if (list.length === 0) {
        inventoryBody.innerHTML = `<tr><td colspan="7" class="text-center py-lg text-on-surface-variant text-sm">Sin productos.</td></tr>`;
        return;
    }
    inventoryBody.innerHTML = list.map(p => `
        <tr>
            <td class="px-4 py-3 font-mono-data text-primary text-xs font-bold">#${p.codigo}</td>
            <td class="px-4 py-3">
                <div class="font-medium">${p.descripcion}</div>
                <div class="text-xs text-on-surface-variant">${p.categoria || ''}${p.marca ? ' • ' + p.marca : ''}</div>
            </td>
            <td class="px-4 py-3 font-mono-data">${p.stock} <span class="text-on-surface-variant text-xs">/ ${p.stock_minimo}</span></td>
            <td class="px-4 py-3 text-right font-mono-data">$${Number(p.costo).toFixed(2)}</td>
            <td class="px-4 py-3 text-right font-mono-data font-bold">$${Number(p.precio).toFixed(2)}</td>
            <td class="px-4 py-3">${estadoBadge(p)}</td>
            <td class="px-4 py-3">
                <div class="flex items-center justify-center gap-2">
                    <button class="edit-btn text-primary" data-id="${p.id}"><span class="material-symbols-outlined text-lg">edit</span></button>
                    <button class="delete-btn text-error" data-id="${p.id}"><span class="material-symbols-outlined text-lg">delete</span></button>
                </div>
            </td>
        </tr>`).join('');

    inventoryBody.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
    inventoryBody.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deleteProducto(btn.dataset.id)));
}

tableSearch.addEventListener('input', () => {
    const q = tableSearch.value.trim().toLowerCase();
    const filtered = PRODUCTOS.filter(p =>
        p.codigo.toLowerCase().includes(q) || p.descripcion.toLowerCase().includes(q) || (p.categoria || '').toLowerCase().includes(q)
    );
    renderTable(filtered);
});

// ------------------------------------------------------------
// MODAL CRUD
// ------------------------------------------------------------
document.getElementById('new-product-btn').addEventListener('click', () => openNewModal());
document.getElementById('cancel-form-btn').addEventListener('click', closeModal);

function openNewModal() {
    modalTitle.textContent = 'Nuevo Producto';
    productForm.reset();
    document.getElementById('form-id').value = '';
    productModal.classList.remove('hidden-modal');
    productModal.classList.add('flex');
}

function openEditModal(id) {
    const p = PRODUCTOS.find(x => x.id === id);
    if (!p) return;
    modalTitle.textContent = 'Editar Producto';
    document.getElementById('form-id').value = p.id;
    document.getElementById('form-codigo').value = p.codigo;
    document.getElementById('form-descripcion').value = p.descripcion;
    document.getElementById('form-categoria').value = p.categoria || '';
    document.getElementById('form-marca').value = p.marca || '';
    document.getElementById('form-costo').value = p.costo;
    document.getElementById('form-precio').value = p.precio;
    document.getElementById('form-stock').value = p.stock;
    document.getElementById('form-stock-minimo').value = p.stock_minimo;
    productModal.classList.remove('hidden-modal');
    productModal.classList.add('flex');
}

function closeModal() {
    productModal.classList.add('hidden-modal');
    productModal.classList.remove('flex');
}

productForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('form-id').value;
    const payload = {
        codigo: document.getElementById('form-codigo').value.trim(),
        descripcion: document.getElementById('form-descripcion').value.trim(),
        categoria: document.getElementById('form-categoria').value.trim() || null,
        marca: document.getElementById('form-marca').value.trim() || null,
        costo: parseFloat(document.getElementById('form-costo').value),
        precio: parseFloat(document.getElementById('form-precio').value),
        stock: parseInt(document.getElementById('form-stock').value, 10),
        stock_minimo: parseInt(document.getElementById('form-stock-minimo').value, 10)
    };

    let error;
    if (id) {
        ({ error } = await supabaseClient.from('productos').update(payload).eq('id', id));
    } else {
        ({ error } = await supabaseClient.from('productos').insert(payload));
    }

    if (error) {
        alert('Error al guardar: ' + error.message);
        console.error(error);
        return;
    }
    closeModal();
    loadProductos();
});

async function deleteProducto(id) {
    if (!confirm('¿Eliminar este producto del inventario?')) return;
    const { error } = await supabaseClient.from('productos').delete().eq('id', id);
    if (error) { alert('Error al eliminar: ' + error.message); return; }
    loadProductos();
}

loadProductos();
</script>
</body>
</html>
