<!DOCTYPE html>
<html class="light" lang="es">
<head>

<script>window.tailwind = window.tailwind || {};</script>
<link rel="stylesheet" href="css/tailwind.css"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = { theme: { extend: { colors: { "primary-container": "#00AAFF", "on-primary-container": "#ffffff", "primary": "#0090D9", "secondary": "#3f3f46", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f6f6", "surface-container": "#eceef0", "surface-container-high": "#e6e8ea", "surface-container-highest": "#e0e3e5", "surface": "#ffffff", "background": "#efefef", "on-background": "#191c1e", "on-surface-variant": "#52525b", "outline-variant": "#e4e4e7", "error": "#ba1a1a", "on-error": "#ffffff" }, spacing: { base: "4px", xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "48px", gutter: "20px" } } } }
</script>
<link rel="stylesheet" href="css/design-system.css"/>
<style>
    .material-symbols-outlined { font-size: 20px; }
    .hidden-modal { display: none !important; }
    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 20px; border-radius: 14px; color: white; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 380px; }
    .toast-error { background: linear-gradient(135deg, #ba1a1a, #d32f2f); }
    .toast-warning { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .toast-info { background: linear-gradient(135deg, #0284c7, #00AAFF); }
    @media (max-width: 1023px) { .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s ease; } .sidebar-desktop.open { transform: translateX(0); } .main-content { margin-left: 0 !important; } .overlay { display: none; } .overlay.active { display: block; } }
    .pp-filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .pp-sel { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 999px; background: #fff; font-size: 14px; color: #3F3F46; }
    .pp-sel b { font-weight: 500; color: #27272A; }
    .pp-sel select { border: 0 !important; box-shadow: none !important; background-color: transparent !important; height: auto !important; min-height: 0 !important; font-size: 14px !important; color: #27272A; outline: none; padding: 0 22px 0 2px !important; cursor: pointer; border-radius: 0 !important; }
    .pp-sel .material-symbols-outlined { font-size: 18px; color: #52525B; }
    .in-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
    @media (max-width: 1100px) { .in-kpis { grid-template-columns: 1fr 1fr; } }
    .in-kpi { background: #fff; border-radius: 22px; padding: 18px 20px; display: flex; justify-content: space-between; gap: 10px; min-height: 96px; }
    .in-kpi b { display: block; font-size: 22px; font-weight: 400; color: #18181B; font-variant-numeric: tabular-nums; }
    .in-kpi span:not(.material-symbols-outlined) { font-size: 14px; color: #52525B; display: block; margin-top: 4px; }
    .in-kpi small { font-size: 12px; color: #71717A; }
    .in-kpi .material-symbols-outlined { width: 34px; height: 34px; border-radius: 999px; background: #F4F4F5; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; color: #52525B; flex: none; }
    .in-name { color: #18181B; text-decoration: underline; text-decoration-color: #D4D4D8; text-underline-offset: 3px; font-weight: 400; }
    .in-name:hover { color: var(--nk-orange-text); text-decoration-color: var(--nk-orange); }
    .in-more { position: relative; }
    .in-more > button { width: 32px; height: 32px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #3F3F46; }
    .in-more > button:hover { background: #F4F4F5; }

</style>
</head>
<body class="bg-background text-on-background min-h-screen">
<div id="toast-container" class="toast-container"></div>
<div id="sidebar-overlay" class="overlay fixed inset-0 bg-black/50 z-30 lg:hidden" onclick="toggleSidebar()"></div>
<button onclick="toggleSidebar()" class="fixed top-4 left-4 z-50 lg:hidden bg-primary text-white p-2 rounded-lg shadow-lg"><span class="material-symbols-outlined">menu</span></button>
<div data-sucursal-badge-mobile class="fixed top-4 right-4 z-50 lg:hidden"></div>
<div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar-desktop fixed left-0 top-0 h-screen w-[280px] bg-surface flex flex-col p-md gap-sm z-40 lg:translate-x-0">
        <div class="mb-lg px-sm flex items-center justify-between">
            <div>
                <div class="text-2xl font-black text-primary tracking-tighter">REFRIMAR</div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-on-surface-variant"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div id="user-badge" class="hidden-modal"><div id="user-name">-</div><div id="user-rol">-</div></div>
        <div data-sucursal-badge class="mx-sm mb-2"></div>
        <nav class="flex flex-col gap-xs flex-1 overflow-y-auto"></nav>
        <div class="mx-sm my-2 h-px bg-outline-variant/40 shrink-0"></div>
        <button id="logout-btn" class="w-full py-3 rounded-lg flex items-center gap-2 text-sm"><span class="material-symbols-outlined">logout</span>Cerrar sesión</button>
    </aside>
    <main class="flex-1 ml-[280px] lg:ml-[280px] main-content p-4 md:p-lg min-w-0">
        <header class="hidden"><h1>Inventario</h1></header>
        <div class="nk-page-head">
            <div>
                <h1>Inventario</h1>
            </div>
            <div class="nk-actions">
                <a href="importar.html" class="nk-btn nk-btn-outline" data-can="editar_inventario">Importar<span class="material-symbols-outlined">upload</span></a>
                <a href="conteo-form.html" class="nk-btn" data-can="editar_inventario">Nuevo conteo<span class="material-symbols-outlined">add</span></a>
            </div>
        </div>
        <div class="pp-filtros">
            <label class="pp-sel"><span class="material-symbols-outlined">storefront</span><b>Tienda:</b><select id="in-tienda"></select></label>
        </div>
        <div class="in-kpis">
            <div class="in-kpi"><div><b id="k-valor">—</b><span id="k-valor-l">Inventario valorizado</span><small id="k-valor-bs"></small></div><span class="material-symbols-outlined">account_balance_wallet</span></div>
            <div class="in-kpi"><div><b id="k-quiebre">0</b><span>Productos en quiebre de stock</span></div><span class="material-symbols-outlined">remove_shopping_cart</span></div>
            <div class="in-kpi"><div><b id="k-bajo">0</b><span>Productos bajo el mínimo</span></div><span class="material-symbols-outlined">trending_down</span></div>
            <div class="in-kpi"><div><b id="k-rot">—</b><span>Productos de baja rotación <small class="nk-hint">(sin ventas en 60 días)</small></span></div><span class="material-symbols-outlined">hourglass_empty</span></div>
        </div>
        <div id="tabla"></div>
    </main>
</div>
<script src="supabase-config.js"></script>
<script src="auth-session.js"></script>
<script src="sucursal-selector.js"></script>
<script src="offline-manager.js"></script>
<script src="js/nk-ui.js"></script>
<script>
var U = nk.boot();
var VER_COSTOS = window.can('ver_costos');
var PRODUCTOS = [], TIENDAS = [], TRANSITO = {}, VENDIDOS = {}, TASA = 0;
function esServ(p) { return p.tipo_producto === 'servicio'; }
function maximo(p) { var mx = Number(p.stock_maximo) || 0, mn = Number(p.stock_minimo) || 0; return mx > 0 ? mx : (mn > 0 ? mn * 4 : 0); }
function estado(p) {
    if (esServ(p)) return 'servicio';
    var s = Number(p._stock) || 0, mn = Number(p.stock_minimo) || 0, mx = maximo(p);
    if (s <= 0) return 'critico';
    if (mn > 0 && s <= mn) return 'bajo';
    if (mx > 0 && s > mx) return 'excedente';
    return 'optimo';
}
var tabla = nk.table({
    el: '#tabla', pageSize: 10,
    placeholder: 'Buscar por nombre, barra, SKU o referencia interna',
    tabs: [{ key: 'todo', label: 'Todo' }, { key: 'optimo', label: 'Stock óptimo', test: function (p) { return estado(p) === 'optimo'; } }, { key: 'excedente', label: 'Stock excedente', test: function (p) { return estado(p) === 'excedente'; } },
        { key: 'bajo', label: 'Stock bajo', test: function (p) { return estado(p) === 'bajo'; } }, { key: 'critico', label: 'Stock crítico', test: function (p) { return estado(p) === 'critico'; } },
        { key: 'transito', label: 'En tránsito', test: function (p) { return (TRANSITO[p.codigo] || 0) > 0; } }],
    search: function (p) { return [p.descripcion, p.codigo, p.sku, p.referencia_interna, (p.codigos_alternos || []).join(' ')].join(' '); },
    filters: [{ key: 'cat', label: 'Categoría', options: [], test: function (p, v) { return (p.categoria || '') === v; } }, { key: 'marca', label: 'Marca', options: [], test: function (p, v) { return (p.marca || '') === v; } }],
    columns: [
        { label: 'Nombre', render: function (p) { return '<a class="in-name" href="producto.html?codigo=' + encodeURIComponent(p.codigo) + '">' + nk.esc(p.descripcion) + '</a><span class="nk-sub">' + nk.esc(p.codigo) + '</span>'; } },
        { label: 'Categoría', render: function (p) { return p.categoria ? nk.esc(p.categoria) + (p.subcategoria ? ' <span class="nk-hint">›</span> <b style="font-weight:500">' + nk.esc(p.subcategoria) + '</b>' : '') : '<span class="nk-hint">Sin categoría</span>'; } },
        { label: 'En tránsito', cls: 'r', render: function (p) { var t = TRANSITO[p.codigo] || 0; return t ? '<b style="font-weight:500;color:var(--nk-orange-text)">' + nk.qty(t) + '</b>' : '0'; } },
        { label: 'Disponibles', cls: 'r', render: function (p) { return esServ(p) ? '∞' : nk.qty(p._stock); } },
        { label: 'Mín / Máx', cls: 'r', render: function (p) { return esServ(p) ? '—' : nk.qty(p.stock_minimo || 0) + ' / ' + (maximo(p) ? nk.qty(maximo(p)) : '—'); } }
    ].concat(VER_COSTOS ? [{ label: 'Valor', cls: 'r', render: function (p) { return esServ(p) ? '—' : nk.usd(Math.max(0, p._stock) * (Number(p._costo) || 0)); } }] : []).concat([
        { label: 'Estado', render: function (p) { return nk.badge(estado(p)); } },
        { label: '', render: function (p) { return '<span class="nk-dd in-more"><button type="button" title="Más"><span class="material-symbols-outlined">more_horiz</span></button><span class="nk-dd-menu"><button type="button" data-ir="producto.html?codigo=' + encodeURIComponent(p.codigo) + '"><span class="material-symbols-outlined">visibility</span>Ver perfil</button>' + (window.can('ver_costos') ? '<button type="button" data-ir="kardex.html?codigo=' + encodeURIComponent(p.codigo) + '"><span class="material-symbols-outlined">swap_vert</span>Ver kardex</button>' : '') + (window.can('editar_inventario') ? '<button type="button" data-ir="producto-form.html?codigo=' + encodeURIComponent(p.codigo) + '"><span class="material-symbols-outlined">edit</span>Editar producto</button>' : '') + '</span></span>'; } }
    ]),
    afterRender: function (tb) {
        tb.querySelectorAll('.in-more').forEach(function (w) {
            var b = w.querySelector('button');
            b.addEventListener('click', function (e) { e.stopPropagation(); document.querySelectorAll('.in-more.open').forEach(function (o) { if (o !== w) o.classList.remove('open'); }); w.classList.toggle('open'); });
            w.querySelectorAll('[data-ir]').forEach(function (x) { x.addEventListener('click', function (e) { e.stopPropagation(); location.href = x.dataset.ir; }); });
        });
    },
    empty: { title: 'Sin productos en esta tienda', sub: 'Importa tu inventario o crea productos.' }
});
document.addEventListener('click', function () { document.querySelectorAll('.in-more.open').forEach(function (o) { o.classList.remove('open'); }); });

async function cargarTienda() {
    tabla.setLoading();
    var t = document.getElementById('in-tienda').value;
    var casa = t === nk.CASA;
    var rows;
    if (casa) rows = PRODUCTOS.map(function (p) { return Object.assign({}, p, { _stock: Number(p.stock) || 0, _costo: p.costo }); });
    else {
        var m = {}, from = 0;
        while (true) {
            var x = await supabaseClient.from('sucursal_stock').select('producto_codigo,stock,costo').eq('sucursal_id', t).range(from, from + 999);
            if (x.error) break;
            (x.data || []).forEach(function (r) { m[r.producto_codigo] = r; });
            if (!x.data || x.data.length < 1000) break;
            from += 1000;
        }
        rows = PRODUCTOS.filter(function (p) { return m[p.codigo]; }).map(function (p) { var r = m[p.codigo]; return Object.assign({}, p, { _stock: Number(r.stock) || 0, _costo: Number(r.costo) > 0 ? r.costo : p.costo }); });
    }
    rows = rows.filter(function (p) { return p.activo !== false || (Number(p._stock) || 0) !== 0; });
    // en tránsito: órdenes de compra ordenadas / parciales hacia esta tienda
    TRANSITO = {};
    var oc = await supabaseClient.from('ordenes_compra').select('id,sucursal_id,estado').in('estado', ['ordenada', 'parcial']);
    var ids = ((oc && oc.data) || []).filter(function (o) { return casa ? (!o.sucursal_id || o.sucursal_id === nk.CASA) : o.sucursal_id === t; }).map(function (o) { return o.id; });
    if (ids.length) {
        var det = await supabaseClient.from('compra_detalles').select('compra_id,producto_codigo,cantidad,cantidad_recibida').in('compra_id', ids);
        ((det && det.data) || []).forEach(function (d) { if (ids.indexOf(d.compra_id) < 0) return; var pend = Math.max(0, Number(d.cantidad) - Number(d.cantidad_recibida || 0)); TRANSITO[d.producto_codigo] = (TRANSITO[d.producto_codigo] || 0) + pend; });
    }
    var fis = rows.filter(function (p) { return !esServ(p); });
    var valor = fis.reduce(function (s, p) { return s + Math.max(0, p._stock) * (Number(p._costo) || 0); }, 0);
    if (VER_COSTOS) { document.getElementById('k-valor').textContent = nk.usd(valor); document.getElementById('k-valor-bs').textContent = TASA ? nk.bs(valor * TASA) : ''; }
    else { document.getElementById('k-valor').textContent = nk.qty(fis.reduce(function (s, p) { return s + Math.max(0, p._stock); }, 0)); document.getElementById('k-valor-l').textContent = 'Unidades en inventario'; }
    document.getElementById('k-quiebre').textContent = fis.filter(function (p) { return p._stock <= 0; }).length;
    document.getElementById('k-bajo').textContent = fis.filter(function (p) { return estado(p) === 'bajo'; }).length;
    var cats = Array.from(new Set(rows.map(function (p) { return p.categoria; }).filter(Boolean))).sort(), marcas = Array.from(new Set(rows.map(function (p) { return p.marca; }).filter(Boolean))).sort();
    var sc = document.querySelector('#tabla [data-filtro="cat"]'), sm = document.querySelector('#tabla [data-filtro="marca"]');
    if (sc) sc.innerHTML = '<option value="">Categoría</option>' + cats.map(function (c) { return '<option>' + nk.esc(c) + '</option>'; }).join('');
    if (sm) sm.innerHTML = '<option value="">Marca</option>' + marcas.map(function (c) { return '<option>' + nk.esc(c) + '</option>'; }).join('');
    tabla.setRows(rows);
    // baja rotación: con stock y sin ventas en 60 días en esta tienda
    var desde = new Date(Date.now() - 60 * 864e5).toISOString();
    var v = await supabaseClient.from('detalle_venta').select('producto_codigo,ventas!inner(created_at,sucursal_id,estado)').gte('ventas.created_at', desde).limit(20000);
    VENDIDOS = {};
    ((v && v.data) || []).forEach(function (l) { var x = l.ventas || {}; if (String(x.estado || '').toLowerCase() === 'anulada') return; if (casa ? (x.sucursal_id && x.sucursal_id !== nk.CASA) : x.sucursal_id !== t) return; VENDIDOS[l.producto_codigo] = true; });
    document.getElementById('k-rot').textContent = v && !v.error ? fis.filter(function (p) { return p._stock > 0 && !VENDIDOS[p.codigo]; }).length : '—';
}
async function iniciar() {
    var res = await Promise.all([nk.cargarProductos('*'), nk.cargarTiendas(), supabaseClient.from('configuracion').select('tasa_bcv_manual').limit(1).maybeSingle()]);
    PRODUCTOS = res[0]; TIENDAS = res[1]; TASA = res[2] && res[2].data ? Number(res[2].data.tasa_bcv_manual) || 0 : 0;
    var sel = document.getElementById('in-tienda');
    sel.innerHTML = TIENDAS.map(function (t) { return '<option value="' + nk.esc(t.id) + '">' + nk.esc(t.nombre) + '</option>'; }).join('');
    sel.value = nk.suc().id;
    if (!nk.esAdmin()) sel.disabled = true;
    sel.addEventListener('change', cargarTienda);
    cargarTienda();
}
if (U) iniciar();

</script>
<script src="quick-actions.js"></script>
<script src="js/ui-animations.js"></script>
</body>
</html>
