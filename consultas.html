<style>
    .material-symbols-outlined { font-size: 20px; }
    .hidden-modal { display: none !important; }
    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 20px; border-radius: 14px; color: white; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 380px; }
    .toast-error { background: linear-gradient(135deg, #ba1a1a, #d32f2f); }
    .toast-warning { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .toast-info { background: linear-gradient(135deg, #0284c7, #00AAFF); }
    .pq { display: flex; flex-direction: column; height: calc(100vh - 210px); min-height: 460px; background: #fff; border-radius: 24px; overflow: hidden; }
    .pq-msgs { flex: 1; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .pq-m { max-width: 760px; font-size: 15px; line-height: 1.55; }
    .pq-m.yo { align-self: flex-end; background: #0A2540; color: #fff; padding: 10px 16px; border-radius: 18px 18px 4px 18px; }
    .pq-m.ia { align-self: flex-start; background: #F4F6F8; padding: 12px 16px; border-radius: 18px 18px 18px 4px; white-space: pre-wrap; }
    .pq-m.ia.pensando { color: #71717A; }
    .pq-sug { display: flex; flex-wrap: wrap; gap: 8px; }
    .pq-sug button { border: 1px solid #E4E4E7; background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
    .pq-sug button:hover { border-color: #00AAFF; background: #F0F9FF; }
    .pq-in { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #F0F0F0; }
    .pq-in textarea { flex: 1; resize: none; border: 1px solid #E4E4E7; border-radius: 16px; padding: 12px 14px; font: inherit; font-size: 15px; outline: none; max-height: 140px; }
    .pq-in textarea:focus { border-color: #00AAFF; }

        <div class="mb-lg px-sm flex items-center justify-between">
            <div>
                <div class="text-2xl font-black text-primary tracking-tighter">REFRIMAR</div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-on-surface-variant"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div id="user-badge" class="hidden-modal"><div id="user-name">-</div><div id="user-rol">-</div></div>
        <div data-sucursal-badge class="mx-sm mb-2"></div>
        <nav class="flex flex-col gap-xs flex-1 overflow-y-auto"></nav>
        <div class="mx-sm my-2 h-px bg-outline-variant/40 shrink-0"></div>
        <button id="logout-btn" class="w-full py-3 rounded-lg flex items-center gap-2 text-sm"><span class="material-symbols-outlined">logout</span>Cerrar sesión</button>
    </aside>
    <main class="flex-1 ml-[280px] lg:ml-[280px] main-content p-4 md:p-lg min-w-0">
        <header class="hidden"><h1>Pregúntale al sistema</h1></header>
        <div class="nk-page-head">
            <div><h1>Pregúntale al sistema</h1><p>Haz preguntas en español sobre ventas, productos, deudas e inventario. Solo consulta: no cambia nada, y solo ve lo que tu usuario tiene permiso de ver.</p></div>
            <div class="nk-actions"><button id="pq-limpiar" class="nk-btn nk-btn-ghost" type="button">Nueva conversación<span class="material-symbols-outlined">restart_alt</span></button></div>
        </div>
        <div class="pq">
            <div class="pq-msgs" id="pq-msgs"></div>
            <div class="pq-in"><textarea id="pq-txt" rows="1" placeholder="Ej: ¿Cuánto vendimos esta semana en cada tienda?"></textarea><button class="nk-btn" id="pq-enviar" type="button"><span class="material-symbols-outlined">send</span>Preguntar</button></div>
        </div>
    </main>
</div>
<script src="supabase-config.js"></script>
<script src="js/empresa.js"></script>
<script src="auth-session.js"></script>
<script src="sucursal-selector.js"></script>
<script src="offline-manager.js"></script>
<script src="js/nk-ui.js"></script>
<script>
var U = nk.boot();
var $ = function (id) { return document.getElementById(id); };
var HIST = [];
var SUG = ['¿Cuánto vendimos esta semana en cada tienda?', '¿Qué 10 productos se vendieron más este mes?', '¿Quién nos debe más?', '¿A qué proveedores les debemos?', '¿Cuánto vale el inventario?', '¿Qué productos tienen 90 días sin venderse?', '¿Cuánto cemento gris queda?'];
function texto(t) { return nk.esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function inicio() {
    $('pq-msgs').innerHTML = '<div class="pq-m ia">Hola, ' + nk.esc((U && U.nombre) || '') + '. Pregúntame lo que necesites saber del negocio.</div><div class="pq-sug">' + SUG.map(function (s) { return '<button type="button">' + nk.esc(s) + '</button>'; }).join('') + '</div>';
    $('pq-msgs').querySelectorAll('.pq-sug button').forEach(function (b) { b.addEventListener('click', function () { $('pq-txt').value = b.textContent; preguntar(); }); });
    HIST = [];
}
function agregar(cls, html) { var d = document.createElement('div'); d.className = 'pq-m ' + cls; d.innerHTML = html; $('pq-msgs').appendChild(d); $('pq-msgs').scrollTop = 1e9; return d; }
async function preguntar() {
    var q = $('pq-txt').value.trim(); if (!q) return;
    var sug = $('pq-msgs').querySelector('.pq-sug'); if (sug) sug.remove();
    $('pq-txt').value = ''; $('pq-enviar').disabled = true;
    agregar('yo', nk.esc(q));
    var p = agregar('ia pensando', 'Buscando en los datos…');
    try {
        var res = await fetch('/api/consulta', { method: 'POST', headers: window.refCabecerasApi(), body: JSON.stringify({ pregunta: q, historial: HIST.slice(-6) }) });
        var j = await res.json().catch(function () { return {}; });
        p.classList.remove('pensando');
        if (!res.ok || !j.respuesta) { p.innerHTML = texto(j.error || 'No pude responder ahora. Intenta de nuevo.'); return; }
        p.innerHTML = texto(j.respuesta);
        HIST.push({ role: 'user', content: q }, { role: 'assistant', content: j.respuesta });
    } catch (e) { p.classList.remove('pensando'); p.textContent = 'Sin conexión. Intenta de nuevo.'; }
    finally { $('pq-enviar').disabled = false; $('pq-txt').focus(); $('pq-msgs').scrollTop = 1e9; }
}
$('pq-enviar').addEventListener('click', preguntar);
$('pq-txt').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); preguntar(); } });
$('pq-limpiar').addEventListener('click', inicio);
if (U) inicio();
</script>
