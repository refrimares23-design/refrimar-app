<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>REFRIMAR // ACCESO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; overflow: hidden; }
  .font-mono-data { font-family: 'JetBrains Mono', monospace; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 20px; }
  
  /* Fondo animado de partículas */
  #particles {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4b 50%, #0d1235 100%);
  }
  
  /* Card glassmorphism */
  .glass-card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,240,255,0.15);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 30px rgba(0,112,243,0.1);
  }
  
  /* Inputs PIN */
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(0,240,255,0.4);
    transition: all 0.2s;
  }
  .pin-dot.filled {
    background: #00f0ff;
    border-color: #00f0ff;
    box-shadow: 0 0 10px rgba(0,240,255,0.6);
  }
  
  /* Teclado numérico */
  .numpad-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s;
  }
  .numpad-btn:active {
    background: rgba(0,112,243,0.3);
    transform: scale(0.95);
  }
  
  /* Scan line */
  .scan-line {
    position: absolute; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #0070f3, transparent);
    animation: scan 3s linear infinite;
    opacity: 0.5;
  }
  @keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
  }
  
  .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  
  .fade-up { animation: fadeUp 0.6s ease-out forwards; opacity: 0; transform: translateY(20px); }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

<canvas id="particles"></canvas>

<div class="relative z-10 w-full max-w-md px-6">
  <!-- Logo -->
  <div class="text-center mb-8 fade-up" style="animation-delay: 0.1s">
    <div class="text-5xl font-black text-white tracking-tighter mb-2" style="text-shadow: 0 0 30px rgba(0,112,243,0.5)">REFRIMAR</div>
    <div class="font-mono-data text-xs text-cyan-400/70 tracking-[0.3em]">SISTEMA DE FACTURACIÓN OS</div>
  </div>

  <!-- Card -->
  <div class="glass-card rounded-2xl p-8 relative overflow-hidden fade-up" style="animation-delay: 0.2s">
    <div class="scan-line"></div>
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 border border-primary/30 mb-4">
        <span class="material-symbols-outlined text-4xl text-primary">lock_person</span>
      </div>
      <h2 class="text-white font-bold text-lg">Ingresar PIN</h2>
      <p class="text-white/40 text-xs mt-1 font-mono-data">Ingresa tu código de acceso</p>
    </div>

    <!-- PIN Display -->
    <div class="flex justify-center gap-3 mb-8" id="pin-display">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>

    <!-- Numpad -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(1)">1</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(2)">2</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(3)">3</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(4)">4</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(5)">5</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(6)">6</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(7)">7</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(8)">8</button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(9)">9</button>
      <button class="numpad-btn rounded-xl py-4 text-error/70 font-mono-data text-sm font-bold flex items-center justify-center" onclick="clearPin()">
        <span class="material-symbols-outlined">backspace</span>
      </button>
      <button class="numpad-btn rounded-xl py-4 text-white font-mono-data text-xl font-bold" onclick="enterDigit(0)">0</button>
      <button class="numpad-btn rounded-xl py-4 text-primary font-mono-data text-sm font-bold flex items-center justify-center" onclick="submitPin()">
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>

    <div id="login-msg" class="text-center text-xs font-mono-data h-4"></div>
  </div>

  <div class="text-center mt-6 text-white/20 text-[10px] font-mono-data fade-up" style="animation-delay: 0.4s">
    REFRIMAR OS v2.5.0 // SECURE NODE
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
let pin = '';
const pinDisplay = document.getElementById('pin-display');
const dots = pinDisplay.querySelectorAll('.pin-dot');
const msg = document.getElementById('login-msg');

function enterDigit(d) {
  if (pin.length >= 4) return;
  pin += d;
  updateDots();
  msg.textContent = '';
}

function clearPin() {
  pin = pin.slice(0, -1);
  updateDots();
  msg.textContent = '';
}

function updateDots() {
  dots.forEach((dot, i) => dot.classList.toggle('filled', i < pin.length));
}

async function submitPin() {
  if (pin.length < 4) {
    msg.textContent = 'Ingresa 4 dígitos';
    msg.className = 'text-center text-xs font-mono-data h-4 text-error';
    shakeCard();
    return;
  }
  
  msg.textContent = 'Verificando...';
  msg.className = 'text-center text-xs font-mono-data h-4 text-primary';
  
  const { data, error } = await supabaseClient
    .from('usuarios')
    .select('*')
    .eq('pin', pin)
    .eq('activo', true)
    .single();
  
  if (error || !data) {
    msg.textContent = 'PIN incorrecto';
    msg.className = 'text-center text-xs font-mono-data h-4 text-error';
    pin = '';
    updateDots();
    shakeCard();
    return;
  }
  
  // Guardar sesión
  const session = {
    id: data.id,
    nombre: data.nombre,
    rol: data.rol,
    loginAt: new Date().toISOString()
  };
  
  // Guardar en auth.js via localStorage temporal (auth.js se carga en las otras páginas)
  sessionStorage.setItem('refrimar_session', JSON.stringify(session));
  
  msg.textContent = '✓ Acceso concedido';
  msg.className = 'text-center text-xs font-mono-data h-4 text-green-400';
  
  setTimeout(() => {
    window.location.replace('facturacion.html');
  }, 400);
}

function shakeCard() {
  const card = document.querySelector('.glass-card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}

// Teclado físico
document.addEventListener('keydown', (e) => {
  if (e.key >= '0' && e.key <= '9') enterDigit(e.key);
  if (e.key === 'Backspace') clearPin();
  if (e.key === 'Enter') submitPin();
});

// Partículas fondo
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
    r: Math.random() * 2 + 1
  });
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,240,255,0.3)';
    ctx.fill();
  });
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0,112,243,${0.15 * (1 - dist/150)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
