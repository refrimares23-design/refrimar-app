<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Página no encontrada · REFRIMAR</title>
<meta content="#00AAFF" name="theme-color"/>
<link href="/img/favicon.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet"/>
<style>
    :root { --azul: #00AAFF; --txt: #18181B; --suave: #52525B; --fondo: #F2F3F5; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --txt: #F4F4F5; --suave: #A1A1AA; --fondo: #18181B; --card: #232326; } }
    :root[data-theme="dark"] { --txt: #F4F4F5; --suave: #A1A1AA; --fondo: #18181B; --card: #232326; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--fondo); color: var(--txt); font-family: Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 480px; background: var(--card); border-radius: 28px; padding: 30px 26px 32px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.07); }
    img.ilu { width: 300px; max-width: 100%; height: auto; }
    .cod { font-family: Poppins, sans-serif; font-weight: 500; font-size: 14px; color: var(--azul); letter-spacing: .08em; margin-top: 4px; }
    h1 { font-family: Poppins, sans-serif; font-weight: 500; font-size: 22px; margin: 6px 0 6px; }
    p { color: var(--suave); font-size: 15px; line-height: 1.5; }
    .acc { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    a, button { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 999px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 14px; text-decoration: none; cursor: pointer; border: 1px solid var(--azul); }
    .pri { background: var(--azul); color: #fff; }
    .sec { background: transparent; color: var(--azul); }
</style>
</head>
<body>
<main class="card">
    <img class="ilu" src="/img/estados/error.svg" alt=""/>
    <div class="cod">ERROR 404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <div class="acc">
        <a class="pri" href="/dashboard.html">Ir al inicio</a>
        <button class="sec" type="button" onclick="history.length > 1 ? history.back() : location.href = '/login.html'">Volver</button>
    </div>
</main>
</body>
</html>
