<script>
var U = nk.boot();
var VER_COSTOS = window.can('ver_costos'), EDITAR = window.can('editar_inventario');
var PRODUCTOS = [];
var UNIDADES = { uds: 'Venta por unidad', mt: 'Venta por metro', kg: 'Venta por kilo' };
function esServ(p) { return p.tipo_producto === 'servicio'; }
function incompleto(p) { return !(Number(p.precio) > 0) || !p.categoria || (VER_COSTOS && !esServ(p) && !(Number(p.costo) > 0)); }
function estatus(p) { return p.estatus || (p.activo === false ? 'inactivo' : 'activo'); }
function sinStock(p) { return !esServ(p) && !(Number(p.stock) > 0); }
var IVA_TXT = { 16: 'IVAG 16%', 8: 'IVAR 8%', 0: 'Exento', 31: 'IVAA 31%' };

var tabla = nk.table({
    el: '#tabla',
    pageSize: 25,
    placeholder: 'Buscar por nombre, código, código de barras o SKU',
    tabs: [
        { key: 'todo', label: 'Todo' },
        { key: 'activo', label: 'Activo', test: function (p) { return estatus(p) === 'activo'; } },
        { key: 'inactivo', label: 'Inactivo', test: function (p) { return estatus(p) === 'inactivo'; } },
        { key: 'borrador', label: 'Borrador', test: function (p) { return estatus(p) === 'borrador'; } },
        { key: 'incompleto', label: 'Incompletos', test: incompleto },
        { key: 'pesados', label: 'Por peso / metro', test: function (p) { return p.unidad === 'kg' || p.unidad === 'mt'; } },
        { key: 'servicios', label: 'Servicios', test: esServ },
        { key: 'sinstock', label: 'Sin stock', test: sinStock }
    ],
    search: function (p) { return [p.codigo, p.descripcion, p.marca, p.categoria, p.subcategoria, p.sku, p.referencia_interna, (p.codigos_alternos || []).join(' '), (p.empaques || []).map(function (e) { return e.barra; }).join(' ')].join(' '); },
    filters: [
        { key: 'cat', label: 'Categoría', options: [], test: function (p, v) { return (p.categoria || '') === v; } },
        { key: 'marca', label: 'Marca', options: [], test: function (p, v) { return (p.marca || '') === v; } },
        { key: 'unidad', label: 'Tipo de venta', options: Object.keys(UNIDADES).map(function (k) { return { value: k, label: UNIDADES[k] }; }), test: function (p, v) { return (p.unidad || 'uds') === v; } },
        { key: 'iva', label: 'Impuesto', options: [{ value: '16', label: 'IVA 16%' }, { value: '8', label: 'IVA 8%' }, { value: '0', label: 'Exento' }, { value: '31', label: 'IVA 31%' }], test: function (p, v) { return String(p.iva_tasa == null ? 16 : Number(p.iva_tasa)) === v; } }
    ],

        { label: 'Tipo producto', render: function (p) { return esServ(p) ? 'Servicio' : nk.esc(UNIDADES[p.unidad || 'uds'] || p.unidad); } },
        { label: 'Categoría', render: function (p) { return p.categoria ? nk.esc(p.categoria) + (p.subcategoria ? ' <span class="nk-hint">›</span> <b style="font-weight:500">' + nk.esc(p.subcategoria) + '</b>' : '') : '<span class="nk-hint">Sin categoría</span>'; } },

    ].concat(VER_COSTOS ? [{ label: 'Costo', cls: 'r', render: function (p) { return nk.usd(p.costo); } }] : []).concat([
        { label: 'Precio', cls: 'r', render: function (p) { return Number(p.precio) > 0 ? '<b>' + nk.usd(p.precio) + '</b>' : '<span class="nk-dif-neg">Sin precio</span>'; } },
        { label: 'Stock', cls: 'r', render: function (p) { if (esServ(p)) return '<span class="nk-hint">Servicio</span>'; var s = Number(p.stock) || 0, min = Number(p.stock_minimo) || 0; return '<span class="' + (s <= 0 ? 'nk-dif-neg' : s <= min ? 'nk-dif-neg' : '') + '">' + nk.qty(s) + '</span><span class="nk-sub">mín ' + nk.qty(min) + '</span>'; } },
        { label: 'Estatus', render: function (p) { return nk.badge(estatus(p)); } },

    ]),

async function cargar() {
    var suc = nk.suc();
    document.getElementById('p-tienda').textContent = suc.nombre;
    tabla.setLoading();
    var all = [], from = 0;
    while (true) {
        var r = await supabaseClient.from('productos').select('*').order('descripcion').range(from, from + 999);
        if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); tabla.setRows([]); return; }
        all = all.concat(r.data || []);
        if (!r.data || r.data.length < 1000) break;
        from += 1000;
    }
    all = window.quitarCostos(all);
    all.forEach(function (p) { p.stock_matriz = Number(p.stock) || 0; });
    if (!nk.esCasa()) {
        var ss = [], f2 = 0;
        while (true) {
            var r2 = await supabaseClient.from('sucursal_stock').select('producto_codigo,stock').eq('sucursal_id', suc.id).range(f2, f2 + 999);
            if (r2.error) break;
            ss = ss.concat(r2.data || []);
            if (!r2.data || r2.data.length < 1000) break;
            f2 += 1000;
        }
        var m = {}; ss.forEach(function (x) { m[x.producto_codigo] = Number(x.stock) || 0; });
        all.forEach(function (p) { p.stock = m[p.codigo] != null ? m[p.codigo] : 0; });
    }
    PRODUCTOS = all;
    var cats = Array.from(new Set(all.map(function (p) { return p.categoria; }).filter(Boolean))).sort();
    var marcas = Array.from(new Set(all.map(function (p) { return p.marca; }).filter(Boolean))).sort();
    var sc = document.querySelector('#tabla [data-filtro="cat"]'), sm = document.querySelector('#tabla [data-filtro="marca"]');
    if (sc) sc.innerHTML = '<option value="">Categoría</option>' + cats.map(function (c) { return '<option>' + nk.esc(c) + '</option>'; }).join('');
    if (sm) sm.innerHTML = '<option value="">Marca</option>' + marcas.map(function (c) { return '<option>' + nk.esc(c) + '</option>'; }).join('');
    document.getElementById('k-total').textContent = all.length.toLocaleString('es-VE');
    document.getElementById('k-incompletos').textContent = all.filter(incompleto).length;
    document.getElementById('k-sinstock').textContent = all.filter(sinStock).length;
    var kv = document.getElementById('k-valor');
    if (kv) kv.textContent = nk.usd(all.reduce(function (s, p) { return esServ(p) ? s : s + (Number(p.costo) || 0) * Math.max(0, Number(p.stock) || 0); }, 0));
    tabla.setRows(all);
}

    { k: 'precio', label: 'Precio de venta $', syn: ['precio', 'precio venta', 'pvp', 'precio usd', 'p venta', 'precio de venta', 'venta', 'precio $', 'precio unitario'] },
    { k: 'stock', label: 'Stock / existencia', syn: ['stock', 'existencia', 'existencias', 'cantidad', 'inventario', 'cant', 'disponible', 'stock actual'] },

    { k: 'detalle', label: 'Descripción larga', syn: ['detalle', 'descripcion larga', 'observacion', 'observaciones', 'nota', 'notas'] }
];
var RUBROS = {
    ferreteria: { label: 'Ferretería', filas: [
        ['7591234000012', '', 'TUBO PVC 1/2" AGUAS BLANCAS 3 MTS', 'PLOMERÍA', 'TUBERÍA', 'Pavco', 'uds', 2.10, 3.50, 40, 10, 16],
        ['CAB12-MT', '', 'CABLE THHN #12 (POR METRO)', 'ELECTRICIDAD', 'CABLES', 'Cablesa', 'mt', 0.35, 0.60, 500, 100, 16],
        ['CLAV3-KG', '', 'CLAVO DE ACERO 3" (POR KILO)', 'FIJACIÓN', 'CLAVOS', 'Genérico', 'kg', 1.80, 2.90, 25, 5, 16]] },
    hogar: { label: 'Hogar', filas: [

        ['7590001000024', '', 'ESCOBA PLÁSTICA', 'LIMPIEZA', '', 'Genérico', 'uds', 1.50, 3.00, 20, 4, 16]] },
    construccion: { label: 'Construcción', filas: [
        ['CEM-42', '', 'CEMENTO GRIS SACO 42,5 KG', 'CONSTRUCCIÓN', 'CEMENTO', 'Cemex', 'uds', 6.50, 8.90, 80, 20, 16],
        ['CAB-ARENA', '', 'ARENA LAVADA (POR SACO)', 'CONSTRUCCIÓN', 'AGREGADOS', 'Genérico', 'uds', 1.00, 2.00, 50, 10, 0]] },
    pinturas: { label: 'Pinturas', filas: [
        ['7590002000016', '', 'PINTURA CAUCHO BLANCO GALÓN', 'PINTURAS', 'CAUCHO', 'Montana', 'uds', 9.00, 14.50, 15, 3, 16],

        ['PROD-001', '', 'PRODUCTO DE EJEMPLO', 'GENERAL', '', 'Genérico', 'uds', 1.00, 2.00, 10, 2, 16]] }
};
function normTxt(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9$% ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function numero(t) {
    if (t === null || t === undefined || t === '') return null;
    if (typeof t === 'number') return isFinite(t) ? t : null;
    t = String(t).replace(/[^0-9.,-]/g, '');
    if (!t) return null;
    var c = t.lastIndexOf(','), d = t.lastIndexOf('.');
    if (c > -1 && d > -1) t = c > d ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
    else if (c > -1) t = t.replace(/\./g, '').replace(',', '.');
    var n = Number(t);
    return isFinite(n) ? n : null;
}
function cargarSheetJS() {
    return nk.cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', function () { return !!window.XLSX; }).then(function () { return window.XLSX; });
}
function detectarEncabezado(filas) {
    var mejor = 0, idx = 0;
    for (var i = 0; i < Math.min(filas.length, 15); i++) {

        if (cat && (p.categoria || '') !== cat) return false;
        if (marca && (p.marca || '') !== marca) return false;
        if (q && normTxt([p.codigo, p.descripcion, p.marca, p.categoria, p.sku, (p.codigos_alternos || []).join(' ')].join(' ')).indexOf(q) < 0) return false;
        return true;
    });
}

function abrirEtiquetas() {
    var lista = filtrados();
    var sel = {};
    var m = nk.modal({
        title: 'Imprimir etiqueta de productos', wide: true,
        body: '<div class="pr-row"><label class="nk-field"><span>Buscar</span><input id="et-q" class="nk-input" placeholder="Nombre o código"/></label><button type="button" class="nk-btn nk-btn-outline" id="et-todos" style="margin-bottom:12px">Marcar visibles</button><button type="button" class="nk-btn nk-btn-ghost" id="et-nada" style="margin-bottom:12px">Ninguno</button></div>' +
            '<div class="nk-hint" id="et-cnt"></div><div class="pr-pick" id="et-list"></div>',
        footer: '<button class="nk-btn" data-a="ok"><span class="material-symbols-outlined">sell</span>Continuar</button>'
    });
    function visibles() { var q = normTxt(m.$('#et-q').value); return lista.filter(function (p) { return !q || normTxt(p.descripcion + ' ' + p.codigo).indexOf(q) >= 0; }); }
    function pintar() {
        var v = visibles();
        m.$('#et-list').innerHTML = v.slice(0, 300).map(function (p) { return '<label><input type="checkbox" data-c="' + nk.esc(p.codigo) + '"' + (sel[p.codigo] ? ' checked' : '') + '/>' + nk.esc(p.descripcion) + '<small>' + nk.esc(p.codigo) + ' · ' + nk.usd(p.precio) + '</small></label>'; }).join('') + (v.length > 300 ? '<div class="pf-empty nk-hint" style="padding:10px">Mostrando 300 de ' + v.length + '. Busca para encontrar otros.</div>' : '') || '<div class="nk-empty" style="display:block;padding:20px">Sin productos</div>';
        m.$('#et-list').querySelectorAll('input').forEach(function (c) { c.addEventListener('change', function () { if (c.checked) sel[c.dataset.c] = true; else delete sel[c.dataset.c]; cnt(); }); });
        cnt();
    }
    function cnt() { m.$('#et-cnt').textContent = Object.keys(sel).length + ' seleccionado(s) · la lista respeta la pestaña y filtros de la tabla'; }
    m.$('#et-q').addEventListener('input', pintar);
    m.$('#et-todos').addEventListener('click', function () { visibles().slice(0, 300).forEach(function (p) { sel[p.codigo] = true; }); pintar(); });
    m.$('#et-nada').addEventListener('click', function () { sel = {}; pintar(); });
    m.$('[data-a="ok"]').addEventListener('click', function () {
        var ps = PRODUCTOS.filter(function (p) { return sel[p.codigo]; });
        if (!ps.length) { nk.toast('Marca al menos un producto', 'warning'); return; }
        m.close(); nk.etiquetas(ps);
    });
    pintar();
}

function abrirCatalogo() {
    var cats = Array.from(new Set(PRODUCTOS.map(function (p) { return p.categoria; }).filter(Boolean))).sort();
    var m = nk.modal({
        title: 'Catálogo de productos',
        body: '<label class="nk-field"><span>Categoría</span><select id="c-cat" class="nk-input"><option value="">Todas las categorías</option>' + cats.map(function (c) { return '<option>' + nk.esc(c) + '</option>'; }).join('') + '</select></label>' +
            '<div class="nk-grid2"><label class="nk-field"><span>Precio</span><select id="c-precio" class="nk-input"><option value="usd">En dólares</option><option value="bs">En bolívares</option><option value="ambos">Dólares y bolívares</option></select></label>' +
            '<label class="nk-field"><span>Productos</span><select id="c-stock" class="nk-input"><option value="1">Solo activos con stock</option><option value="0">Todos los activos</option></select></label></div>' +
            '<label class="nk-field"><span>Fotos</span><select id="c-fotos" class="nk-input"><option value="1">Incluir fotos (si tienen)</option><option value="0">Sin fotos (más rápido)</option></select></label>' +
            '<p class="nk-hint">Se abre lista para imprimir o guardar en PDF (en la ventana de impresión elige "Guardar como PDF") y compartirlo por WhatsApp.</p>',
        footer: '<button class="nk-btn" data-a="ok"><span class="material-symbols-outlined">print</span>Generar catálogo</button>'
    });
    m.$('[data-a="ok"]').addEventListener('click', function (e) {
        var cat = m.$('#c-cat').value, modoP = m.$('#c-precio').value, conStock = m.$('#c-stock').value === '1', fotos = m.$('#c-fotos').value === '1';
        nk.busy(e.currentTarget, async function () {
            var ps = PRODUCTOS.filter(function (p) { return estatus(p) === 'activo' && Number(p.precio) > 0 && (!cat || p.categoria === cat) && (!conStock || esServ(p) || Number(p.stock) > 0); });
            if (!ps.length) { nk.toast('No hay productos para ese catálogo', 'warning'); return; }
            var tasa = 0;
            if (modoP !== 'usd') { var r = await supabaseClient.from('configuracion').select('tasa_bcv_manual').limit(1).maybeSingle(); tasa = r && r.data ? Number(r.data.tasa_bcv_manual) || 0 : 0; }
            var imgs = {};
            if (fotos) {
                var cods = ps.map(function (p) { return p.codigo; });
                for (var i = 0; i < cods.length; i += 150) {
                    var ri = await supabaseClient.from('producto_imagenes').select('producto_codigo,imagenes').in('producto_codigo', cods.slice(i, i + 150));
                    if (ri.error) break;
                    (ri.data || []).forEach(function (x) { if (x.imagenes && x.imagenes[0]) imgs[x.producto_codigo] = x.imagenes[0]; });
                }
            }
            var grupos = {};
            ps.forEach(function (p) { var g = p.categoria || 'OTROS'; (grupos[g] = grupos[g] || []).push(p); });
            var html = Object.keys(grupos).sort().map(function (g) {
                return '<h2>' + nk.esc(g) + '</h2><div class="grid">' + grupos[g].map(function (p) {
                    var pr = Number(p.precio) || 0;
                    var ptxt = modoP === 'usd' || !tasa ? nk.usd(pr) : modoP === 'bs' ? nk.bs(pr * tasa) : nk.usd(pr) + '<small>' + nk.bs(pr * tasa) + '</small>';
                    return '<div class="it">' + (fotos ? '<div class="ph">' + (imgs[p.codigo] ? '<img src="' + imgs[p.codigo] + '"/>' : '') + '</div>' : '') + '<div class="nm">' + nk.esc(p.descripcion) + '</div><div class="cd">' + nk.esc(p.codigo) + (p.marca ? ' · ' + nk.esc(p.marca) : '') + '</div><div class="pr">' + ptxt + '</div></div>';
                }).join('') + '</div>';
            }).join('');
            var css = '@page{margin:12mm}*{font-family:Arial,Helvetica,sans-serif;color:#111;box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #00AAFF;padding-bottom:8px;margin-bottom:6px}header img{height:42px}header div{text-align:right;font-size:11px;color:#555}' +
                'h2{font-size:14px;color:#0090D9;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.it{border:1px solid #e5e5e5;border-radius:10px;padding:8px;break-inside:avoid}' +
                '.ph{height:90px;background:#f4f4f5;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}.ph img{max-width:100%;max-height:100%}.nm{font-size:11px;font-weight:bold;line-height:1.2;min-height:2.4em}.cd{font-size:9px;color:#666;margin:3px 0}.pr{font-size:14px;font-weight:bold;color:#0090D9}.pr small{display:block;font-size:10px;color:#444;font-weight:normal}';
            var logo = location.origin + location.pathname.replace(/[^/]*$/, '') + 'img/logo-refrimar-azul.png';
            var doc = '<!doctype html><html><head><meta charset="utf-8"><title>Catálogo REFRIMAR</title><style>' + css + '</style></head><body><header><img src="' + logo + '"/><div>Catálogo de productos' + (cat ? ' · ' + nk.esc(cat) : '') + '<br/>' + nk.fecha(new Date().toISOString()) + (tasa && modoP !== 'usd' ? ' · Tasa ' + nk.num(tasa, 2) + ' Bs/$' : '') + '<br/>' + ps.length + ' productos</div></header>' + html + '</body></html>';
            var fr = document.createElement('iframe');
            fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
            document.body.appendChild(fr);
            fr.onload = function () { setTimeout(function () { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (x) {} setTimeout(function () { fr.remove(); }, 60000); }, 400); };
            fr.srcdoc = doc;
            m.close();
        });
    });
}

async function abrirHistorico() {
    var m = nk.modal({ title: 'Histórico de importación', wide: true, body: '<div id="h-tabla"></div>' });
    var t = nk.table({
        el: m.$('#h-tabla'), pageSize: 10, placeholder: 'Buscar por archivo, usuario o tienda',
        search: function (x) { return [x.archivo, x.usuario_nombre, x.sucursal_nombre].join(' '); },
        columns: [
            { label: 'Fecha', render: function (x) { return nk.fechaHora(x.created_at); } },
            { label: 'Archivo', render: function (x) { return '<b style="font-weight:500">' + nk.esc(x.archivo || '—') + '</b><span class="nk-sub">' + nk.esc(x.usuario_nombre || '') + '</span>'; } },
            { label: 'Tienda', render: function (x) { return nk.esc(x.sucursal_nombre || ''); } },
            { label: 'Stock', render: function (x) { return ({ reemplazar: 'Reemplazó', sumar: 'Sumó', no_tocar: 'No tocó' })[x.modo_stock] || nk.esc(x.modo_stock || ''); } },
            { label: 'Filas', cls: 'r', render: function (x) { return x.filas; } },
            { label: 'Creados', cls: 'r', render: function (x) { return '<span class="nk-dif-pos">' + x.creados + '</span>'; } },
            { label: 'Actualizados', cls: 'r', render: function (x) { return x.actualizados; } },
            { label: 'Errores', cls: 'r', render: function (x) { return x.errores ? '<button type="button" class="nk-btn nk-btn-outline nk-btn-sm" data-err="' + nk.esc(x.id) + '">' + x.errores + ' · descargar</button>' : '0'; } }
        ],
        afterRender: function (tb) { tb.querySelectorAll('[data-err]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); var x = t.rows().find(function (r) { return r.id === b.dataset.err; }); if (x) descargarErrores(x.detalle_errores); }); }); },
        empty: { title: 'Sin importaciones registradas', sub: 'Cada vez que importes un Excel quedará aquí.' }
    });
    t.setLoading();
    var r = await supabaseClient.from('importaciones_productos').select('*').order('created_at', { ascending: false }).limit(200);
    if (r.error) { t.setRows([]); nk.toast('Para ver el histórico corre en Supabase supabase-migration-productos-ficha.sql', 'warning'); return; }
    t.setRows(r.data || []);
}

async function exportar() {
    var head = ['Código', 'Códigos de barra', 'Nombre', 'Categoría', 'Subcategoría', 'Marca', 'Unidad'].concat(VER_COSTOS ? ['Costo'] : []).concat(['Precio', 'Stock', 'Stock mínimo', 'IVA', 'SKU', 'Estatus', 'Tipo']);
    var rows = filtrados().map(function (p) {
        return [p.codigo, (p.codigos_alternos || []).join(' '), p.descripcion, p.categoria || '', p.subcategoria || '', p.marca || '', p.unidad || 'uds']
            .concat(VER_COSTOS ? [Number(p.costo || 0)] : []).concat([Number(p.precio || 0), esServ(p) ? '' : Number(p.stock || 0), Number(p.stock_minimo || 0), p.iva_tasa == null ? 16 : Number(p.iva_tasa), p.sku || '', estatus(p), esServ(p) ? 'servicio' : 'fisico']);
    });
    var nombre = 'productos_' + nk.suc().nombre.replace(/\s+/g, '_') + '_' + nk.hoyISO();
    try {
        var X = await cargarSheetJS();
        var ws = X.utils.aoa_to_sheet([head].concat(rows));
        ws['!cols'] = head.map(function (h, i) { return { wch: i === 2 ? 44 : 14 }; });
        var wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Productos');
        X.writeFile(wb, nombre + '.xlsx');
    } catch (e) {
        var csv = '﻿' + [head].concat(rows).map(function (x) { return x.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nombre + '.csv'; a.click();
    }
}
