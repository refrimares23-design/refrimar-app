<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>REFRIMAR // Acceso</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #05070a; overflow: hidden; height: 100vh; }
    .font-mono-data { font-family: 'JetBrains Mono', monospace; }
    .glass-login {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 240, 255, 0.15);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .pin-dot {
        width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid rgba(0, 112, 243, 0.4);
        transition: all 0.2s;
    }
    .pin-dot.filled {
        background: #0070f3;
        border-color: #0070f3;
        box-shadow: 0 0 10px rgba(0, 112, 243, 0.5);
    }
    .numpad-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        transition: all 0.15s;
    }
    .numpad-btn:active { transform: scale(0.95); background: rgba(0, 112, 243, 0.2); border-color: #0070f3; }
    .location-btn {
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.15s;
    }
    .location-btn:hover { border-color: rgba(0,112,243,0.6); background: rgba(0,112,243,0.06); }
    .location-btn.selected { border-color: #0070f3; background: rgba(0,112,243,0.1); }
    .location-btn.selected .location-check { color: #0070f3; }
    .location-check { color: transparent; transition: color 0.15s; }
    @keyframes shake {
        0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-10px)} 80%{transform:translateX(10px)}
    }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-up { animation: fade-up 0.6s ease-out forwards; opacity: 0; }
    .anim-delay-1 { animation-delay: 0.1s; }
    .anim-delay-2 { animation-delay: 0.3s; }
    .anim-delay-3 { animation-delay: 0.5s; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<canvas id="bg-canvas" class="fixed inset-0 z-0"></canvas>

<div class="relative z-10 w-full max-w-sm">
    <div class="glass-login rounded-2xl p-8 text-center">

        <!-- PASO 1: Selección obligatoria de Ubicación -->
        <div id="step-location" class="anim-fade-up anim-delay-1">
            <div class="mb-6">
                <h1 class="text-4xl font-black text-white tracking-tighter">REFRI<span class="text-[#0070f3]">MAR</span></h1>
                <p class="text-xs text-gray-500 font-mono-data mt-1 uppercase tracking-widest">Sistema POS // Acceso</p>
            </div>
            <p class="text-xs text-gray-400 font-mono-data uppercase tracking-widest mb-3 flex items-center justify-center gap-2">
                <span class="text-[#0070f3] font-bold">1</span><span class="h-px w-4 bg-white/20"></span> Selecciona tu ubicación
            </p>
            <div id="location-list" class="space-y-2 mb-4 max-h-[260px] overflow-y-auto pr-1"></div>
            <button id="location-next" class="hidden w-full py-3 rounded-lg bg-[#0070f3] text-white font-bold text-sm tracking-wider uppercase transition-all hover:brightness-110 active:scale-[0.98]">
                <span class="flex items-center justify-center gap-2">Continuar<span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span></span>
            </button>
        </div>

        <!-- PASO 2: Usuario + PIN -->
        <div id="step-login" class="hidden">
            <div class="mb-4 text-left">
                <button onclick="backToLocation()" class="text-[11px] text-gray-500 hover:text-[#0070f3] flex items-center gap-1 transition-colors">
                    <span class="material-symbols-outlined" style="font-size:14px;">arrow_back</span>Cambiar ubicación
                </button>
            </div>
            <div class="mb-5">
                <p class="text-xs text-gray-400 font-mono-data uppercase tracking-widest mb-2 flex items-center justify-center gap-2">
                    <span class="text-[#0070f3] font-bold">2</span><span class="h-px w-4 bg-white/20"></span> Usuario en <span id="location-name-display" class="text-[#0070f3] font-bold">-</span>
                </p>
            </div>
            <select id="user-select" class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-3 text-white text-sm outline-none focus:border-[#0070f3] transition-colors mb-4">
                <option value="" class="bg-[#0a0e17]">Selecciona usuario...</option>
            </select>
            <div id="pin-display" class="flex justify-center gap-3 mb-2">
                <div class="pin-dot" data-i="0"></div>
                <div class="pin-dot" data-i="1"></div>
                <div class="pin-dot" data-i="2"></div>
                <div class="pin-dot" data-i="3"></div>
            </div>
            <p class="text-[10px] text-gray-600 font-mono-data mb-4">Ingresa tu PIN de 4 dígitos</p>

            <div class="grid grid-cols-3 gap-2">
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('1')">1</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('2')">2</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('3')">3</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('4')">4</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('5')">5</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('6')">6</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('7')">7</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('8')">8</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('9')">9</button>
                <button class="numpad-btn rounded-lg py-4 text-error font-bold text-sm" onclick="clearPin()">BORRAR</button>
                <button class="numpad-btn rounded-lg py-4 text-white font-bold text-lg" onclick="pressKey('0')">0</button>
                <button class="numpad-btn rounded-lg py-4 text-[#0070f3] font-bold" onclick="submitLogin()"><span class="material-symbols-outlined">login</span></button>
            </div>

            <div id="login-msg" class="mt-4 text-xs font-mono-data text-error h-4"></div>
        </div>
    </div>
</div>

<script src="supabase-config.js"></script>
<script src="auth-session.js"></script>
<script>
window.CASA_MATRIZ_ID = '00000000-0000-0000-0000-000000000001';
let ubicacionSeleccionada = null;

// ---------- Fondo de partículas ----------
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
class Particle {
    constructor(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.vx=(Math.random()-0.5)*0.3; this.vy=(Math.random()-0.5)*0.3; this.size=Math.random()*1.5+0.3; }
    update(){ this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
    draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle='rgba(0,112,243,0.4)'; ctx.fill(); }
}
for(let i=0;i<60;i++)particles.push(new Particle());
function animate(){
    ctx.fillStyle='rgba(5,7,10,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{p.update();p.draw();});
    requestAnimationFrame(animate);
}
animate();

// ---------- PASO 1: Ubicaciones (Casa Matriz + Sucursales) ----------
async function loadLocations(){
    const list = document.getElementById('location-list');
    list.innerHTML = '';
    const opts = [{ id: window.CASA_MATRIZ_ID, nombre: 'Casa Matriz', detalle: 'Sede principal' }];
    const res = await supabaseClient.from('sucursales').select('id,nombre').order('nombre');
    if(!res.error && res.data) res.data.forEach(s => opts.push({ id: s.id, nombre: s.nombre, detalle: 'Sucursal' }));
    opts.forEach(o => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'location-btn w-full text-left bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white flex items-center gap-3';
        b.innerHTML =
            '<span class="material-symbols-outlined text-[#0070f3]">storefront</span>' +
            '<span class="flex-1 text-left"><span class="block text-sm font-bold">' + o.nombre + '</span>' +
            '<span class="block text-[10px] text-gray-500 font-mono-data uppercase tracking-widest">' + o.detalle + '</span></span>' +
            '<span class="material-symbols-outlined location-check">check_circle</span>';
        b.addEventListener('click', function(){
            document.querySelectorAll('.location-btn').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            ubicacionSeleccionada = { id: o.id, nombre: o.nombre };
            document.getElementById('location-next').classList.remove('hidden');
        });
        list.appendChild(b);
    });
}

document.getElementById('location-next').addEventListener('click', function(){
    if(!ubicacionSeleccionada) return;
    document.getElementById('location-name-display').textContent = ubicacionSeleccionada.nombre;
    document.getElementById('step-location').classList.add('hidden');
    document.getElementById('step-login').classList.remove('hidden');
    pin = ''; updateDots(); document.getElementById('login-msg').textContent = '';
    loadUsers();
});

function backToLocation(){
    document.getElementById('step-login').classList.add('hidden');
    document.getElementById('step-location').classList.remove('hidden');
    pin = ''; updateDots(); document.getElementById('login-msg').textContent = '';
}

// ---------- PASO 2: Usuarios + PIN ----------
async function loadUsers(){
    const {data,error}=await supabaseClient.from('usuarios').select('nombre,rol').eq('activo',true);
    const sel=document.getElementById('user-select');
    sel.innerHTML='<option value="" class="bg-[#0a0e17]">Selecciona usuario...</option>';
    if(!error&&data){ data.forEach(u=>{ const o=document.createElement('option'); o.value=u.nombre; o.textContent=u.nombre+' ('+u.rol+')'; o.className='bg-[#0a0e17]'; sel.appendChild(o); }); }
}

let pin='';
async function sha256(str){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function pressKey(k){
    if(pin.length<4){ pin+=k; updateDots(); }
    if(pin.length===4) submitLogin();
}
function clearPin(){ pin=''; updateDots(); document.getElementById('login-msg').textContent=''; }
function updateDots(){
    document.querySelectorAll('.pin-dot').forEach((d,i)=>{ if(i<pin.length)d.classList.add('filled'); else d.classList.remove('filled'); });
}
async function submitLogin(){
    const nombre=document.getElementById('user-select').value;
    const msg=document.getElementById('login-msg');
    if(!nombre){ msg.textContent='Selecciona un usuario'; msg.className='mt-4 text-xs font-mono-data text-error h-4'; return; }
    if(pin.length!==4){ msg.textContent='Ingresa los 4 dígitos'; msg.className='mt-4 text-xs font-mono-data text-error h-4'; return; }
    msg.textContent='Verificando...'; msg.className='mt-4 text-xs font-mono-data text-gray-500 h-4';
    const hash=await sha256(pin);
    const {data,error}=await supabaseClient.rpc('login_usuario',{nombre_input:nombre,pin_input:hash});
    if(error||!data||!data.success){
        msg.textContent='PIN incorrecto'; msg.className='mt-4 text-xs font-mono-data text-error h-4';
        document.querySelector('.glass-login').classList.add('shake');
        setTimeout(()=>document.querySelector('.glass-login').classList.remove('shake'),400);
        pin=''; updateDots(); return;
    }
    let permisos=[];
    try{
        const {data:udata}=await supabaseClient.from('usuarios').select('permisos').eq('id',data.id).single();
        permisos=(udata&&udata.permisos)||[];
    }catch(e){ permisos=[]; }
    // Sesión SOLO en sessionStorage: se borra al cerrar la pestaña/navegador.
    window.guardarSesion({ id:data.id, nombre:data.nombre, rol:data.rol, permisos:permisos, loginAt:Date.now() });
    window.guardarSucursalSesion(ubicacionSeleccionada);
    try { localStorage.removeItem(window.REF_SESION_KEY); localStorage.removeItem(window.REF_SUCURSAL_KEY); } catch(e) {}
    window.location.replace('facturacion.html');
}
document.addEventListener('keydown',e=>{
    if(e.key>='0'&&e.key<='9') pressKey(e.key);
    if(e.key==='Backspace'){ pin=pin.slice(0,-1); updateDots(); document.getElementById('login-msg').textContent=''; }
    if(e.key==='Enter'){
        if(!document.getElementById('step-location').classList.contains('hidden') && ubicacionSeleccionada){
            document.getElementById('location-next').click();
        } else {
            submitLogin();
        }
    }
});

loadLocations();
</script>
</body>
</html>
