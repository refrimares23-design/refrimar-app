var U = nk.boot();

function mover(p, dt) {
    if (p.wait > 0) { p.wait -= dt; p.moving = false; return; }

            var s = p.plan.shift();
            if (s.ir) p.path = s.ir.filter(Boolean).map(function (q) { return q.slice(); });
            else if (s.esperar) p.wait = s.esperar;
            else if (s.hacer) s.hacer(p);

        return;
    }
    var t = p.path[0], dx = t[0] - p.x, dy = t[1] - p.y, d = Math.hypot(dx, dy), st = p.speed * dt;
    if (d <= st) { p.x = t[0]; p.y = t[1]; p.path.shift(); } else { p.x += dx / d * st; p.y += dy / d * st; }
    p.moving = d > 0.01; p.ph += dt * 11;
}

/* ------------------------------------------------------------ ciclo */
var tPrev = performance.now(), tPensar = 0, tCola = 0, tAmb = 5, tResumen = 0;
function ciclo(now) {
    requestAnimationFrame(ciclo);
    if (document.hidden || !TIENDAS.length) { tPrev = now; return; }
    var dt = Math.min(0.05, (now - tPrev) / 1000); tPrev = now; RELOJ += dt;
    if (camMeta) {
        var f = 1 - Math.pow(0.001, dt);
        cam.z += (camMeta.z - cam.z) * f; cam.ox += (camMeta.ox - cam.ox) * f; cam.oy += (camMeta.oy - cam.oy) * f;
        if (Math.abs(camMeta.z - cam.z) < 0.001 && Math.abs(camMeta.ox - cam.ox) < 0.5) camMeta = null;
    }
    PERS.forEach(function (p) {
        mover(p, dt);
        if (p.tipo !== 'staff') { if (p.fin) p.alpha -= dt * 2; else p.alpha = Math.min(1, p.alpha + dt * 2.5); }
        if (p.burbuja) { p.burbuja.t -= dt; if (p.burbuja.t <= 0) p.burbuja = null; }
    });
    PERS = PERS.filter(function (p) { return !(p.fin && p.alpha <= 0); });
    if (SEL && PERS.indexOf(SEL) < 0) cerrarPop();
    CAMIONES.forEach(function (c) { moverCamion(c, dt); if (c.fin) c.alpha -= dt * 2; });
    CAMIONES = CAMIONES.filter(function (c) { return !(c.fin && c.alpha <= 0); });
    FX.forEach(function (fx) { fx.t += dt; if (fx.t >= fx.T && !fx.hecho) { fx.hecho = true; if (fx.ultimo && fx.fin) fx.fin(); } });
    FX = FX.filter(function (fx) { return fx.t < fx.T; });
    TEXTOS.forEach(function (t) { t.t += dt; }); TEXTOS = TEXTOS.filter(function (t) { return t.t < t.T; });
    PILAS.forEach(function (p) { p.vida -= dt; }); PILAS = PILAS.filter(function (p) { return p.vida > 0 && p.n > 0; });
    tPensar -= dt; if (tPensar <= 0) { tPensar = 0.5; PERS.forEach(function (p) { if (p.tipo === 'staff') pensarStaff(p); }); }
    tCola -= dt; if (tCola <= 0 && COLA.length) { tCola = 1.6; COLA.shift()(); }
    tAmb -= dt;
    if (tAmb <= 0) {
        tAmb = rnd(9, 18);
        TIENDAS.forEach(function (t) { var n = PERS.filter(function (p) { return p.tienda === t && p.tipo !== 'staff'; }).length; if (t.abierta && n < 2 && Math.random() < 0.6) clienteAmbiente(t); });
    }
    if (DEMO) { DEMO_T -= dt; if (DEMO_T <= 0) { DEMO_T = rnd(3.5, 7); pasoDemo(); } }
    tResumen -= dt; if (tResumen <= 0) { tResumen = 30; resumir(); }

    dibujar();
}
function medir() {
