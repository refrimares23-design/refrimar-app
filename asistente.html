<style>
    .material-symbols-outlined { font-size: 20px; }

    .as-top { background: #fff; border-radius: 24px; padding: 18px 22px; box-shadow: 0 0 0 1px #E4E4E7; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
    .as-top .t { flex: 1; min-width: 220px; }
    .as-top b { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 16px; color: #18181B; }

    .as-prog { flex: 2; min-width: 220px; height: 10px; border-radius: 10px; background: var(--rubro-suave, #E6F6FF); overflow: hidden; }
    .as-prog i { display: block; height: 100%; width: 0; background: var(--rubro-acento, #00AAFF); border-radius: 10px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

    .as-grid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
    .as-pasos { background: #fff; border-radius: 24px; padding: 10px; box-shadow: 0 0 0 1px #E4E4E7; list-style: none; position: sticky; top: 16px; }
    .as-pasos li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: transparent; border-radius: 14px; cursor: pointer; text-align: left; font-size: 14px; color: #3F3F46; }
    .as-pasos li button:hover { background: #F4F4F5; }
    .as-pasos li button[aria-current="step"] { background: var(--rubro-suave, #E6F6FF); color: #0A2540; font-weight: 600; }
    .as-pasos .ic { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 12px; font-weight: 600; background: #F4F4F5; color: #52525B; }
    .as-pasos .ic .material-symbols-outlined { font-size: 16px; }
    .as-pasos .hecho .ic { background: #0A2540; color: #fff; }
    .as-pasos .omitido .ic { background: #FEF3C7; color: #92400E; }
    .as-card { background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 0 0 1px #E4E4E7; min-width: 0; }
    .as-card h2 { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 22px; color: #18181B; letter-spacing: -.01em; }
    .as-card .lead { color: #52525B; margin-top: 4px; font-size: 14.5px; max-width: 70ch; }
    .as-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin-top: 18px; }
    .as-form .ancho { grid-column: 1 / -1; }
    .as-ayuda { font-size: 12.5px; color: #71717A; margin-top: -6px; margin-bottom: 10px; }
    .as-err { color: #B42318; font-size: 13px; margin-top: -6px; margin-bottom: 10px; }
    .as-pie { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #F4F4F5; }
    .as-pie .sp { flex: 1; }
    .as-logo { display: flex; align-items: center; gap: 14px; }
    .as-logo .prev { width: 76px; height: 76px; border-radius: 18px; background: #F4F4F5; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; box-shadow: 0 0 0 1px #E4E4E7; }
    .as-logo .prev img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .as-opciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 16px; }
    .as-op { position: relative; display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 18px; box-shadow: 0 0 0 1px #E4E4E7; cursor: pointer; background: #fff; }
    .as-op input { position: absolute; opacity: 0; pointer-events: none; }
    .as-op .material-symbols-outlined { color: var(--rubro-oscuro, #00649C); }
    .as-op b { display: block; font-size: 14.5px; color: #18181B; font-weight: 600; }
    .as-op small { display: block; font-size: 12.5px; color: #52525B; margin-top: 2px; }
    .as-op:has(input:checked) { box-shadow: 0 0 0 2px var(--rubro-acento, #00AAFF); background: var(--rubro-suave, #F5FBFF); }
    .as-op:has(input:focus-visible) { outline: 3px solid var(--rubro-acento, #00AAFF); outline-offset: 2px; }
    .as-check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #F4F4F5; font-size: 14.5px; }
    .as-check:first-child { border-top: 0; }
    .as-check input { width: 18px; height: 18px; margin-top: 2px; accent-color: #0A2540; flex: none; }
    .as-check small { display: block; color: #52525B; font-size: 13px; }
    .as-lista { margin-top: 14px; display: grid; gap: 8px; }
    .as-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; box-shadow: 0 0 0 1px #E4E4E7; }
    .as-item div { flex: 1; min-width: 0; }
    .as-item b { display: block; font-size: 14.5px; color: #18181B; font-weight: 600; }
    .as-item small { display: block; font-size: 13px; color: #52525B; }
    .as-ok { color: #067647; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
    .as-nota { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--rubro-suave, #F5FBFF); color: #0A2540; font-size: 13.5px; }
    .as-res-ok, .as-res-pend { display: grid; gap: 8px; margin-top: 12px; }
    .as-dev { display: grid; gap: 8px; margin-top: 12px; }
    @media (max-width: 1023px) { .as-grid { grid-template-columns: 1fr; } .as-pasos { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 8px; scrollbar-width: none; } .as-pasos li { flex: none; } .as-pasos li button span.n { display: none; } .as-pasos li button[aria-current="step"] span.n { display: inline; } }
    @media (max-width: 640px) { .as-form { grid-template-columns: 1fr; } .as-card { padding: 18px; } .as-pie .nk-btn { flex: 1; } .as-pie .sp { display: none; } }

</style>

<script>
var U = nk.boot();
try { sessionStorage.setItem('ref_asistente_visto', '1'); } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
var esc = nk.esc;
var CFG = {}, OP = {}, EST = {}, PROG = { paso: 0, hechos: [], omitidos: [] }, ACT = 0;
var ESTADOS_VE = ['Amazonas', 'Anzoátegui', 'Apure', 'Aragua', 'Barinas', 'Bolívar', 'Carabobo', 'Cojedes', 'Delta Amacuro', 'Distrito Capital', 'Falcón', 'Guárico', 'La Guaira', 'Lara', 'Mérida', 'Miranda', 'Monagas', 'Nueva Esparta', 'Portuguesa', 'Sucre', 'Táchira', 'Trujillo', 'Yaracuy', 'Zulia'];
var METODOS = [['efectivo', 'payments', 'Efectivo', 'Bolívares y dólares'], ['pago_movil', 'smartphone', 'Pago móvil', 'Con banco y referencia'], ['punto', 'credit_card', 'Débito (punto de venta)', 'Tarjeta de débito o crédito'],
    ['transferencia', 'account_balance', 'Transferencia', 'En bolívares o Zelle'], ['credito', 'handshake', 'Crédito a clientes', 'Venta a cuenta por cobrar'], ['otros', 'more_horiz', 'Otros', 'Zelle, Binance y otros en divisas']];

// ---------- Pasos ----------
var PASOS = [
    { id: 'fiscal', t: 'Datos fiscales', auto: function () { return EST.fiscal; } },
    { id: 'rubro', t: 'Tipo de negocio', auto: function () { return EST.rubro; } },
    { id: 'tiendas', t: 'Tiendas y almacenes', auto: function () { return !!OP.nombre_principal; } },
    { id: 'monedas', t: 'Monedas y tasa BCV', auto: function () { return !!OP.moneda_precios && EST.tasa; } },
    { id: 'impuestos', t: 'IVA e IGTF', auto: function () { return OP.iva_defecto != null; } },
    { id: 'retenciones', t: 'Contribuyente especial', auto: function () { return OP.contribuyente_especial != null; } },
    { id: 'facturas', t: 'Facturas y numeración', auto: function () { return !!(OP.facturacion && OP.facturacion.modo); } },
    { id: 'impresora', t: 'Impresora fiscal', auto: function () { return !!OP.impresora_lista || (OP.facturacion && OP.facturacion.modo && OP.facturacion.modo !== 'fiscal'); } },
    { id: 'pagos', t: 'Métodos de pago', auto: function () { return Array.isArray(OP.metodos_pago) && OP.metodos_pago.length > 0; } },
    { id: 'equipo', t: 'Tu equipo', auto: function () { return EST.usuarios > 1; } },
    { id: 'productos', t: 'Productos', auto: function () { return EST.productos > 0; } },
    { id: 'inventario', t: 'Inventario inicial', auto: function () { return EST.con_stock > 0; } },
    { id: 'saldos', t: 'Saldos iniciales', auto: function () { return EST.clientes_saldo > 0 || EST.cxp > 0; } },
    { id: 'resumen', t: 'Lo que te falta', auto: function () { return false; } }
];
function estadoPaso(p) {
    if (p.id === 'resumen') return '';
    if (p.auto() || PROG.hechos.indexOf(p.id) >= 0) return 'hecho';
    if (PROG.omitidos.indexOf(p.id) >= 0) return 'omitido';
    return '';
}
function listos() { return PASOS.filter(function (p) { return p.id !== 'resumen' && estadoPaso(p) === 'hecho'; }).length; }

async function cargar() {
    var c = await supabaseClient.from('configuracion').select('*').limit(1).maybeSingle();
    CFG = (c && c.data) || {};
    OP = CFG.opciones || {};
    PROG = Object.assign({ paso: 0, hechos: [], omitidos: [] }, OP.asistente || {});
    var e = await supabaseClient.rpc('asistente_estado');
    EST = (e && !e.error && e.data) || {};
    if (e && e.error && /function|schema cache/i.test(e.error.message || '')) nk.toast('Falta correr el SQL de actualización en Supabase', 'warning');
}
async function guardarProgreso(extra) {
    var r = await supabaseClient.rpc('config_opciones_guardar', { p_opciones: Object.assign({ asistente: PROG }, extra || {}) });
    if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return false; }
    Object.assign(OP, extra || {}); OP.asistente = PROG;
    try { localStorage.setItem('refrimar_opciones_negocio', JSON.stringify(OP)); } catch (x) {}
    return true;
}
function marcar(id, como) {
    PROG.hechos = PROG.hechos.filter(function (x) { return x !== id; });
    PROG.omitidos = PROG.omitidos.filter(function (x) { return x !== id; });
    if (como === 'hecho') PROG.hechos.push(id); else if (como === 'omitido') PROG.omitidos.push(id);
}

function pintarLista() {
    $('as-pasos').innerHTML = PASOS.map(function (p, i) {
        var st = estadoPaso(p);
        var ic = st === 'hecho' ? '<span class="material-symbols-outlined">check</span>' : st === 'omitido' ? '<span class="material-symbols-outlined">schedule</span>' : (p.id === 'resumen' ? '<span class="material-symbols-outlined">flag</span>' : (i + 1));
        return '<li class="' + st + '"><button type="button" data-i="' + i + '"' + (i === ACT ? ' aria-current="step"' : '') + '><span class="ic">' + ic + '</span><span class="n">' + esc(p.t) + '</span></button></li>';
    }).join('');
    var n = listos(), tot = PASOS.length - 1, pct = Math.round(n / tot * 100);
    $('as-barra').style.width = pct + '%'; $('as-pct').textContent = pct + '%';
    $('as-sub').textContent = n + ' de ' + tot + ' pasos listos' + (n === tot ? '. ¡Todo configurado!' : '');
}
$('as-pasos').addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b) ir(Number(b.dataset.i)); });

function ir(i) {
    ACT = Math.max(0, Math.min(PASOS.length - 1, i));
    PROG.paso = ACT;
    pintarLista();
    var p = PASOS[ACT];
    $('as-card').innerHTML = RENDER[p.id]();
    if (INIT[p.id]) INIT[p.id]();
    var pie = document.createElement('div');
    pie.className = 'as-pie';
    if (p.id !== 'resumen') {
        pie.innerHTML = (ACT > 0 ? '<button type="button" class="nk-btn nk-btn-outline" data-atras>Atrás</button>' : '') + '<span class="sp"></span>' +
            '<button type="button" class="nk-btn nk-btn-outline" data-omitir>Omitir por ahora</button><button type="button" class="nk-btn" data-seguir>Guardar y seguir</button>';
    } else {
        pie.innerHTML = '<button type="button" class="nk-btn nk-btn-outline" data-atras>Atrás</button><span class="sp"></span><a class="nk-btn" href="dashboard.html">Ir al sistema</a>';
    }
    $('as-card').appendChild(pie);
    var at = pie.querySelector('[data-atras]'); if (at) at.onclick = function () { ir(ACT - 1); };
    var om = pie.querySelector('[data-omitir]'); if (om) om.onclick = function () { nk.busy(om, async function () { if (estadoPaso(p) !== 'hecho') marcar(p.id, 'omitido'); await guardarProgreso(); ir(ACT + 1); }); };
    var sg = pie.querySelector('[data-seguir]'); if (sg) sg.onclick = function () { nk.busy(sg, async function () { var ok = await (GUARDAR[p.id] ? GUARDAR[p.id]() : true); if (ok === false) return; marcar(p.id, 'hecho'); await guardarProgreso(); ir(ACT + 1); }); };
    var h = $('as-card').querySelector('h2'); if (h) { h.setAttribute('tabindex', '-1'); if (window.innerWidth < 1024) $('as-card').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

function campo(id, label, valor, extra) {
    extra = extra || {};
    return '<label class="pf-f' + (extra.ancho ? ' ancho' : '') + '"><span>' + label + (extra.req ? ' <b>*</b>' : '') + '</span>' +
        '<input class="pf-in" id="' + id + '" value="' + esc(valor == null ? '' : valor) + '"' + (extra.attrs || '') + '/>' +
        (extra.ayuda ? '<small class="as-ayuda" style="margin:2px 0 0">' + extra.ayuda + '</small>' : '') + '</label>';
}
function seleccion(id, label, opciones, valor, ancho) {
    return '<label class="pf-f' + (ancho ? ' ancho' : '') + '"><span>' + label + '</span><select class="pf-in" id="' + id + '">' + opciones.map(function (o) {
        var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
        return '<option value="' + esc(v) + '"' + (String(v) === String(valor) ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('') + '</select></label>';
}
function opcion(name, tipo, valor, icono, titulo, sub, marcado) {
    return '<label class="as-op"><input type="' + tipo + '" name="' + name + '" value="' + esc(valor) + '"' + (marcado ? ' checked' : '') + '/>' +
        (icono ? '<span class="material-symbols-outlined" aria-hidden="true">' + icono + '</span>' : '') + '<div><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div></label>';
}
function hechoTxt(ok, txt) { return ok ? '<span class="as-ok"><span class="material-symbols-outlined">check_circle</span>' + esc(txt || 'Listo') + '</span>' : ''; }

var RENDER = {}, INIT = {}, GUARDAR = {};

// 1. Datos fiscales
RENDER.fiscal = function () {
    var emp = window.RefEmpresa ? window.RefEmpresa.marca() : {};
    return '<h2>Datos fiscales</h2><p class="lead">Salen en tus facturas, notas de crédito y libros. Usa los datos exactos de tu RIF.</p>' +
        '<div class="as-form">' +
        campo('f-razon', 'Razón social', CFG.nombre_negocio, { req: true, ancho: true }) +
        campo('f-comercial', 'Nombre comercial', OP.nombre_comercial || emp.comercial || '', { ayuda: 'El nombre con el que te conocen tus clientes.' }) +
        campo('f-rif', 'RIF', CFG.rif, { req: true, attrs: ' placeholder="J-12345678-9" maxlength="14"' }) +
        campo('f-dir', 'Domicilio fiscal', CFG.direccion, { req: true, ancho: true, ayuda: 'Tal como aparece en tu RIF.' }) +
        campo('f-ciudad', 'Ciudad', OP.ciudad || '') +
        seleccion('f-estado', 'Estado', [['', 'Elige el estado']].concat(ESTADOS_VE), OP.estado_ve || '') +
        campo('f-tel', 'Teléfono', CFG.telefono, { attrs: ' type="tel"' }) +
        campo('f-mail', 'Correo', CFG.email, { attrs: ' type="email"' }) +
        '<div class="pf-f ancho"><span>Logo (opcional)</span><div class="as-logo"><div class="prev" id="f-logo-prev">' + (OP.logo ? '<img src="' + esc(OP.logo) + '" alt="Logo actual"/>' : '<span class="material-symbols-outlined">image</span>') + '</div>' +
        '<div><input type="file" id="f-logo" accept="image/png,image/jpeg,image/webp" hidden/><button type="button" class="nk-btn nk-btn-outline" id="f-logo-b">Elegir imagen</button>' +
        (OP.logo ? ' <button type="button" class="nk-btn nk-btn-outline" id="f-logo-x">Quitar</button>' : '') + '<p class="as-ayuda" style="margin:6px 0 0">PNG o JPG. Lo achicamos para que cargue rápido.</p></div></div></div>' +
        '<p class="as-err ancho" id="f-err" role="alert"></p></div>';
};
var LOGO = undefined;
INIT.fiscal = function () {
    $('f-rif').addEventListener('blur', function () { var n = window.RefEmpresa.normRif(this.value); if (n) this.value = n; });
    $('f-logo-b').onclick = function () { $('f-logo').click(); };

        '<div class="as-lista"><div class="as-item"><span class="material-symbols-outlined">request_quote</span><div><b>Clientes con saldo: ' + (EST.clientes_saldo || 0) + '</b><small>Cuentas por cobrar</small></div>' + hechoTxt(EST.clientes_saldo > 0) + '<a class="nk-btn nk-btn-outline" href="importar.html#cxc">Importar</a></div>' +
        '<div class="as-item"><span class="material-symbols-outlined">receipt_long</span><div><b>Facturas de proveedores: ' + (EST.cxp || 0) + '</b><small>Cuentas por pagar</small></div>' + hechoTxt(EST.cxp > 0) + '<a class="nk-btn nk-btn-outline" href="importar.html#cxp">Importar</a></div></div>' +
        '<p class="as-nota">Si empiezas sin deudas, marca "Guardar y seguir".</p>';
};

// Resumen: lo que te falta
RENDER.resumen = function () {
    var pend = PASOS.filter(function (p) { return p.id !== 'resumen' && estadoPaso(p) !== 'hecho'; });
    var ok = PASOS.filter(function (p) { return p.id !== 'resumen' && estadoPaso(p) === 'hecho'; });
    return '<h2>' + (pend.length ? 'Lo que te falta configurar' : '¡Tu empresa está lista!') + '</h2>' +
        '<p class="lead">' + (pend.length ? 'Puedes empezar a vender ya. Esto queda pendiente y lo completas cuando quieras desde Configuración → Primeros pasos.' : 'Ya puedes vender, facturar y cerrar caja.') + '</p>' +
        (pend.length ? '<div class="as-res-pend">' + pend.map(function (p) { return '<div class="as-item"><span class="material-symbols-outlined">' + (estadoPaso(p) === 'omitido' ? 'schedule' : 'radio_button_unchecked') + '</span><div><b>' + esc(p.t) + '</b><small>' + (estadoPaso(p) === 'omitido' ? 'Lo dejaste para después' : 'Pendiente') + '</small></div><button type="button" class="nk-btn nk-btn-outline" data-ir="' + PASOS.indexOf(p) + '">Completar</button></div>'; }).join('') + '</div>' : '') +
        (ok.length ? '<div class="as-res-ok" style="margin-top:16px">' + ok.map(function (p) { return '<div class="as-item"><span class="material-symbols-outlined" style="color:#067647">check_circle</span><div><b>' + esc(p.t) + '</b></div></div>'; }).join('') + '</div>' : '') +
        '<div class="as-pie" style="border:0"><a class="nk-btn" href="pos.html"><span class="material-symbols-outlined">point_of_sale</span>Abrir la caja</a></div>';
};
INIT.resumen = function () {
    document.querySelectorAll('[data-ir]').forEach(function (b) { b.onclick = function () { ir(Number(b.dataset.ir)); }; });
    var pend = PASOS.filter(function (p) { return p.id !== 'resumen' && estadoPaso(p) !== 'hecho'; }).length;
    if (!PROG.terminado) { PROG.terminado = true; PROG.pendientes = pend; guardarProgreso(); }
    else if (PROG.pendientes !== pend) { PROG.pendientes = pend; guardarProgreso(); }
};

(async function () {
    if (!window.can('configuracion')) { $('as-card').innerHTML = '<h2>Solo el dueño o un administrador puede configurar la empresa</h2>'; return; }
    await cargar();
    var pre = Number((location.hash.match(/paso=(\d+)/) || [])[1]);
    ir(isNaN(pre) || !location.hash ? Math.min(PROG.paso || 0, PASOS.length - 1) : pre);
})();

</script>
<script src="quick-actions.js"></script>
<script src="js/ui-animations.js"></script>
</body>
