    tailwind.config = { theme: { extend: { colors: { "primary-container": "#00AAFF", "on-primary-container": "#ffffff", "primary": "#0090D9", "secondary": "#3f3f46", "surface-container-lowest": "#ffffff", "surface-container-low": "#f6f6f6", "surface-container": "#eceef0", "surface-container-high": "#e6e8ea", "surface-container-highest": "#e0e3e5", "surface": "#ffffff", "background": "#efefef", "on-background": "#191c1e", "on-surface-variant": "#52525b", "outline-variant": "#e4e4e7", "error": "#ba1a1a", "on-error": "#ffffff" }, spacing: { base: "4px", xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "48px", gutter: "20px" } } } }
</script>

<style>
    .material-symbols-outlined { font-size: 20px; }
    .hidden-modal { display: none !important; }
    .toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 20px; border-radius: 14px; color: white; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 380px; }
    .toast-error { background: linear-gradient(135deg, #ba1a1a, #d32f2f); }
    .toast-warning { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .toast-info { background: linear-gradient(135deg, #0284c7, #00AAFF); }
    @media (max-width: 1023px) { .sidebar-desktop { transform: translateX(-100%); transition: transform 0.3s ease; } .sidebar-desktop.open { transform: translateX(0); } .main-content { margin-left: 0 !important; } .overlay { display: none; } .overlay.active { display: block; } }

<body class="bg-background text-on-background min-h-screen">
<div id="toast-container" class="toast-container"></div>
<div id="sidebar-overlay" class="overlay fixed inset-0 bg-black/50 z-30 lg:hidden" onclick="toggleSidebar()"></div>
<button onclick="toggleSidebar()" class="fixed top-4 left-4 z-50 lg:hidden bg-primary text-white p-2 rounded-lg shadow-lg"><span class="material-symbols-outlined">menu</span></button>
<div data-sucursal-badge-mobile class="fixed top-4 right-4 z-50 lg:hidden"></div>
<div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar-desktop fixed left-0 top-0 h-screen w-[280px] bg-surface flex flex-col p-md gap-sm z-40 lg:translate-x-0">
        <div class="mb-lg px-sm flex items-center justify-between">
            <div>
                <div class="text-2xl font-black text-primary tracking-tighter">REFRIMAR</div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-on-surface-variant"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div id="user-badge" class="hidden-modal"><div id="user-name">-</div><div id="user-rol">-</div></div>
        <div data-sucursal-badge class="mx-sm mb-2"></div>
        <nav class="flex flex-col gap-xs flex-1 overflow-y-auto"></nav>
        <div class="mx-sm my-2 h-px bg-outline-variant/40 shrink-0"></div>
        <button id="logout-btn" class="w-full py-3 rounded-lg flex items-center gap-2 text-sm"><span class="material-symbols-outlined">logout</span>Cerrar sesión</button>
    </aside>
    <main class="flex-1 ml-[280px] lg:ml-[280px] main-content p-4 md:p-lg min-w-0">
        <header class="hidden"><h1>Gestión del equipo</h1></header>
        <div class="nk-page-head">
            <div>
                <h1>Gestión del equipo</h1>
                <p>Administra roles y estados del equipo de forma simple y ordenada.</p>
            </div>
        </div>
        <section class="pf-card">
            <h2>Propietario de la empresa</h2>
            <div id="eq-owner" class="eq-owner"><span class="eq-av">…</span><div>Cargando…</div></div>
        </section>
        <section class="pf-card" style="margin-top:16px">
            <h2>Colaboradores <a href="colaborador-form.html" id="eq-add" class="nk-btn nk-btn-outline" data-can="invitar_usuario">Agregar colaborador<span class="material-symbols-outlined">add</span></a></h2>
            <div class="eq-tabs" id="eq-tabs">
                <button type="button" data-t="activo" class="on">Activos<em id="eq-n-activo"></em></button>
                <button type="button" data-t="inactivo">Inactivos<em id="eq-n-inactivo"></em></button>
                <button type="button" data-t="pendiente">Pendientes<em id="eq-n-pendiente"></em></button>
                <button type="button" data-t="cancelado">Cancelados<em id="eq-n-cancelado"></em></button>
            </div>
            <label class="pf-inbtn" style="display:block;margin-bottom:6px"><input id="eq-q" class="pf-in" placeholder="Buscar colaborador" autocomplete="off"/><button type="button" tabindex="-1"><span class="material-symbols-outlined">search</span></button></label>
            <div id="eq-lista"></div>
        </section>
    </main>
</div>
<script src="supabase-config.js"></script>
<script src="js/empresa.js"></script>
<script src="auth-session.js"></script>
<script src="sucursal-selector.js"></script>
<script src="offline-manager.js"></script>
<script src="js/nk-ui.js"></script>
<script>
var U = nk.boot();
var $ = function (id) { return document.getElementById(id); };
var TODOS = [], TIENDAS = {}, OWNER = null, TAB = 'activo';
var t0 = new URLSearchParams(location.search).get('tab'); if (t0) TAB = t0;

function iniciales(n) { return String(n || '?').trim().split(/\s+/).map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase(); }
function av(u, cls) { return '<span class="eq-av ' + (cls || '') + '">' + (u.avatar_url ? '<img src="' + nk.esc(u.avatar_url) + '" alt="" referrerpolicy="no-referrer"/>' : nk.esc(iniciales(u.nombre))) + '</span>'; }
function estadoDe(u) { return u.estado || (u.activo === false ? 'inactivo' : 'activo'); }
function tiendasDe(u) {
    var l = (u.sucursales && u.sucursales.length) ? u.sucursales : (u.sucursal_id ? [u.sucursal_id] : []);
    if (u.rol === 'admin' && !l.length) return 'Todas las tiendas';
    return l.map(function (id) { return TIENDAS[id] || 'Tienda'; }).join(', ') || 'Sin tienda';
}

async function cargar() {
    var r = await supabaseClient.from('usuarios').select(window.REF_USUARIO_COLS || 'id,nombre,rol').order('nombre');
    if (r.error) { $('eq-lista').innerHTML = '<div class="nt-empty">' + nk.esc(nk.errMsg(r.error)) + '</div>'; return; }
    (await nk.cargarTiendas()).forEach(function (t) { TIENDAS[t.id] = t.nombre; });
    TODOS = (r.data || []).map(function (u) { delete u.pin; return u; });
    var cfg = await supabaseClient.from('configuracion').select('email').limit(1).maybeSingle();
    var correo = cfg && cfg.data && String(cfg.data.email || '').toLowerCase();
    var admins = TODOS.filter(function (u) { return u.rol === 'admin' && estadoDe(u) === 'activo'; });
    OWNER = admins.find(function (u) { return correo && String(u.email || '').toLowerCase() === correo; }) ||
            admins.slice().sort(function (a, b) { return String(a.created_at || '').localeCompare(String(b.created_at || '')); })[0] || null;
    pintarOwner();
    pintar();
}
function pintarOwner() {
    if (!OWNER) { $('eq-owner').innerHTML = '<div style="color:#71717A">Sin administrador registrado</div>'; return; }
    $('eq-owner').innerHTML = av(OWNER) + '<div style="min-width:0"><div style="font-size:18px;text-transform:capitalize;color:#18181B">' + nk.esc(OWNER.nombre) + '</div>' +
        '<div style="color:#52525B;font-size:14px">' + nk.esc(OWNER.email || 'Sin correo de Google — agrégalo para entrar con Google') + '</div></div>' +
        '<a class="nk-btn nk-btn-ghost nk-btn-sm" style="margin-left:auto" href="colaborador-form.html?id=' + OWNER.id + '">Editar</a>';
}
function pintar() {
    var q = $('eq-q').value.trim().toLowerCase();
    var lista = TODOS.filter(function (u) { return !OWNER || u.id !== OWNER.id; });
    ['activo', 'inactivo', 'pendiente', 'cancelado'].forEach(function (t) {
        var n = lista.filter(function (u) { return estadoDe(u) === t; }).length;
        $('eq-n-' + t).textContent = n ? '(' + n + ')' : '';
    });
    document.querySelectorAll('#eq-tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === TAB); });
    var vis = lista.filter(function (u) {
        if (estadoDe(u) !== TAB) return false;
        if (!q) return true;
        return [u.nombre, u.email, window.nombreRol(u.rol)].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (!vis.length) {
        var nom = { activo: 'activos', inactivo: 'inactivos', pendiente: 'con invitación pendiente', cancelado: 'cancelados' }[TAB];
        $('eq-lista').innerHTML = q ? window.refEstado('busqueda', 'No se encontraron resultados.', 'Nadie coincide con "' + q + '".', '', 'sm') :
            window.refEstado('vacio', 'No hay colaboradores ' + nom, TAB === 'activo' ? 'Invita a tu equipo con el botón Agregar colaborador.' : '', '', 'sm');
        return;
    }
    $('eq-lista').innerHTML = vis.map(function (u) {
        var acc = '';
        if (TAB === 'pendiente' && window.can('invitar_usuario')) acc = '<button type="button" class="nk-btn nk-btn-outline nk-btn-sm" data-inv="' + u.id + '">Enviar invitación<span class="material-symbols-outlined">send</span></button>';
        return '<div class="eq-row" data-id="' + u.id + '">' + av(u, 'sm') +
            '<div class="eq-main"><b>' + nk.esc(u.nombre) + '</b><span>' + nk.esc(u.email || 'Sin correo · entra con PIN') + '</span></div>' +
            '<span class="eq-tag eq-hide-sm">' + nk.esc(window.nombreRol(u.rol)) + '</span>' +
            '<span class="eq-tag eq-hide-sm" title="Acceso a tiendas">' + nk.esc(tiendasDe(u)) + '</span>' +
            '<div class="eq-act">' + acc + '</div>' +
            '<span class="material-symbols-outlined" style="color:#A1A1AA">chevron_right</span></div>';
    }).join('');
}
$('eq-lista').addEventListener('click', async function (e) {
    var inv = e.target.closest('[data-inv]');
    if (inv) {
        e.stopPropagation();
        var u = TODOS.find(function (x) { return x.id === inv.dataset.inv; });
        await nk.busy(inv, async function () {
            var r = await supabaseClient.rpc('invitacion_enlace', { p_id: u.id });
            if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
            window.compartirInvitacion(u, r.data.token);
        });
        return;
    }
    var row = e.target.closest('.eq-row');
    if (row) location.href = 'colaborador-form.html?id=' + row.dataset.id;
});
$('eq-tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; TAB = b.dataset.t; history.replaceState(null, '', '?tab=' + TAB); pintar(); });
$('eq-q').addEventListener('input', pintar);
cargar();

</script>
<script src="quick-actions.js"></script>
<script src="js/ui-animations.js"></script>
</body>
</html>
