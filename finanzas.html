<script>
var U = nk.boot();
var VER_COSTOS = window.can('ver_costos');
var $ = function (id) { return document.getElementById(id); };
var TIENDAS = [], TASA = 0, TAB = 'comp';
function rango(k) {
    var h = new Date(), y = h.getFullYear(), m = h.getMonth();
    var d = function (a, b, c) { return new Date(a, b, c); };
    var r = { mes: [d(y, m, 1), d(y, m + 1, 1)], mes_ant: [d(y, m - 1, 1), d(y, m, 1)], trim: [d(y, m - 2, 1), d(y, m + 1, 1)], anio: [d(y, 0, 1), d(y + 1, 0, 1)], anio_ant: [d(y - 1, 0, 1), d(y, 0, 1)] }[k];
    var dur = r[1] - r[0];
    var ant = k === 'anio' || k === 'anio_ant' ? [d(r[0].getFullYear() - 1, 0, 1), d(r[0].getFullYear(), 0, 1)] : [new Date(r[0].getTime() - dur), r[0]];
    if (k === 'mes' || k === 'mes_ant') ant = [d(r[0].getFullYear(), r[0].getMonth() - 1, 1), r[0]];
    return { desde: r[0], hasta: r[1], antDesde: ant[0], antHasta: ant[1] };
}
function iso(d) { return d.toISOString(); }
function f(d) { return d.toLocaleDateString('es-VE', { day: 'numeric', month: 'numeric', year: 'numeric' }); }
function fmtK(v) { var a = Math.abs(v); return (v < 0 ? '−' : '') + (a >= 1e6 ? nk.num(a / 1e6, 2) + ' M' : a >= 1e3 ? nk.num(a / 1e3, 2) + ' K' : nk.num(a, 2)); }
function enSuc(sucId) { var s = $('fn-suc').value; if (s === 'todas') return true; if (s === nk.CASA) return !sucId || sucId === nk.CASA; return sucId === s; }
async function paginar(qf) { var all = [], from = 0; while (true) { var r = await qf().range(from, from + 999); if (r.error) return { error: r.error, data: all }; all = all.concat(r.data || []); if (!r.data || r.data.length < 1000) break; from += 1000; } return { data: all }; }
async function periodo(desde, hasta) {
    var v = await paginar(function () { return supabaseClient.from('ventas').select('id,total_usd,total_devuelto_usd,estado,sucursal_id,created_at,iva').gte('created_at', iso(desde)).lt('created_at', iso(hasta)); });
    var ventas = (v.data || []).filter(function (x) { return String(x.estado || '').toLowerCase() !== 'anulada' && enSuc(x.sucursal_id); });
    var bruto = ventas.reduce(function (s, x) { return s + (Number(x.total_usd) || 0); }, 0);
    var dev = ventas.reduce(function (s, x) { return s + (Number(x.total_devuelto_usd) || 0); }, 0);
    var iva = ventas.reduce(function (s, x) { return s + (Number(x.iva) || 0); }, 0);
    var costo = 0;
    if (VER_COSTOS) {
        var dv = await paginar(function () { return supabaseClient.from('detalle_venta').select('cantidad,costo_unitario,ventas!inner(created_at,estado,sucursal_id)').gte('ventas.created_at', iso(desde)).lt('ventas.created_at', iso(hasta)); });
        (dv.data || []).forEach(function (l) { var x = l.ventas || {}; var t = new Date(x.created_at); if (t < desde || t >= hasta) return; if (String(x.estado || '').toLowerCase() === 'anulada' || !enSuc(x.sucursal_id)) return; costo += (Number(l.cantidad) || 0) * (Number(l.costo_unitario) || 0); });
    }
    var g = await paginar(function () { return supabaseClient.from('gastos').select('categoria,monto_usd,fecha,sucursal_id').gte('fecha', iso(desde).slice(0, 10)).lt('fecha', iso(hasta).slice(0, 10)); });
    var gastos = (g.data || []).filter(function (x) { return enSuc(x.sucursal_id); });
    var porCat = {}; gastos.forEach(function (x) { var c = x.categoria || 'Otros'; porCat[c] = (porCat[c] || 0) + (Number(x.monto_usd) || 0); });
    var totG = gastos.reduce(function (s, x) { return s + (Number(x.monto_usd) || 0); }, 0);
    var netas = bruto - dev - iva;
    return { bruto: bruto, dev: dev, iva: iva, netas: netas, costo: costo, utilBruta: netas - costo, gastos: totG, porCat: porCat, neta: netas - costo - totG, n: ventas.length };
}
async function balances() {
    var out = { caja: null, cajaTxt: '', inv: 0, cxc: 0, cxp: 0 };
    var cb = await supabaseClient.from('cuentas_bancarias').select('moneda,saldo').eq('activa', true);
    if (!cb.error) {
        var ves = 0, usd = 0; (cb.data || []).forEach(function (c) { if (c.moneda === 'USD') usd += Number(c.saldo) || 0; else ves += Number(c.saldo) || 0; });
        out.caja = usd + (TASA ? ves / TASA : 0); out.cajaTxt = nk.usd(usd) + ' + ' + nk.num(ves, 2) + ' Bs';
    }
    if (VER_COSTOS) {
        var prods = await nk.cargarProductos('codigo,costo,stock,tipo_producto');
        var s = $('fn-suc').value;
        if (s === 'todas' || s === nk.CASA) prods.forEach(function (p) { if (p.tipo_producto !== 'servicio') out.inv += Math.max(0, Number(p.stock) || 0) * (Number(p.costo) || 0); });
        if (s !== nk.CASA) {
            var costoMap = {}; prods.forEach(function (p) { costoMap[p.codigo] = p; });
            var ss = await paginar(function () { var q = supabaseClient.from('sucursal_stock').select('producto_codigo,stock,costo,sucursal_id'); return s === 'todas' ? q : q.eq('sucursal_id', s); });
            (ss.data || []).forEach(function (r) { var p = costoMap[r.producto_codigo] || {}; if (p.tipo_producto === 'servicio') return; out.inv += Math.max(0, Number(r.stock) || 0) * (Number(r.costo) > 0 ? Number(r.costo) : Number(p.costo) || 0); });
        }
    }
    var cl = await supabaseClient.from('clientes').select('saldo_pendiente,sucursal_id');
    (cl.data || []).forEach(function (c) { if ($('fn-suc').value === 'todas' || enSuc(c.sucursal_id)) out.cxc += Number(c.saldo_pendiente) || 0; });
    var cp = await supabaseClient.from('compras_proveedores').select('monto,monto_abonado,estado,sucursal_id');
    (cp.data || []).forEach(function (c) { if (String(c.estado || '').toLowerCase() === 'pagada') return; if ($('fn-suc').value === 'todas' || enSuc(c.sucursal_id)) out.cxp += Math.max(0, (Number(c.monto) || 0) - (Number(c.monto_abonado) || 0)); });
    return out;
}
function vari(a, b) { if (!b) return a ? '<span class="fn-up">nuevo</span>' : '—'; var p = (a - b) / Math.abs(b) * 100; return '<span class="' + (p >= 0 ? 'fn-up' : 'fn-down') + '">' + (p >= 0 ? '+' : '') + nk.num(p, 1) + '%</span>'; }
async function cargar() {
    var R = rango($('fn-per').value);
    var hoy = new Date(); var hasta = R.hasta > hoy ? hoy : new Date(R.hasta.getTime() - 864e5);
    $('fn-per-t').textContent = f(R.desde) + ' - ' + (R.hasta > hoy ? 'Día actual' : f(hasta));
    $('fn-cuerpo').innerHTML = '<div class="nk-loading" style="padding:20px">Calculando…</div>';
    var res = await Promise.all([periodo(R.desde, R.hasta), periodo(R.antDesde, R.antHasta), balances()]);
    var a = res[0], b = res[1], bal = res[2];
    $('k-v').textContent = nk.usd(a.bruto); $('k-v2').textContent = TASA ? nk.bs(a.bruto * TASA) : '';
    $('k-c').textContent = bal.caja == null ? '—' : nk.usd(bal.caja); $('k-c2').textContent = bal.caja == null ? 'Registra tus cuentas en Bancos' : bal.cajaTxt;
    $('k-i').textContent = VER_COSTOS ? nk.usd(bal.inv) : '—'; $('k-i2').textContent = VER_COSTOS ? 'a costo' : '';
    $('k-x').textContent = nk.usd(bal.cxc - bal.cxp); $('k-x2').textContent = 'Cobrar ' + nk.usd(bal.cxc) + ' · Pagar ' + nk.usd(bal.cxp);
    var anioA = R.desde.getFullYear(), etA = $('fn-per').selectedOptions[0].text, etB = 'Periodo anterior';
    if (TAB === 'comp') {
        var filas = [['Ventas totales', a.bruto, b.bruto], ['Devoluciones (notas de crédito)', -a.dev, -b.dev], ['IVA cobrado', -a.iva, -b.iva], ['Ventas netas', a.netas, b.netas, 1]]
            .concat(VER_COSTOS ? [['Costo de ventas', -a.costo, -b.costo], ['Utilidad bruta', a.utilBruta, b.utilBruta, 1]] : [])
            .concat([['Gastos', -a.gastos, -b.gastos]]).concat(VER_COSTOS ? [['Utilidad neta', a.neta, b.neta, 1]] : []).concat([['Facturas emitidas', a.n, b.n, 0, 'n']]);
        $('fn-cuerpo').innerHTML = '<div class="nk-table-wrap"><table class="fn-tbl"><thead><tr><th>Moneda: USD</th><th>' + nk.esc(etA) + '</th><th>' + etB + '</th><th>Variación</th></tr></thead><tbody>' +
            filas.map(function (r) { return '<tr class="' + (r[3] ? 'fn-t' : '') + '"><td>' + r[0] + '</td><td>' + (r[4] === 'n' ? r[1] : fmtK(r[1])) + '</td><td>' + (r[4] === 'n' ? r[2] : fmtK(r[2])) + '</td><td>' + vari(r[1], r[2]) + '</td></tr>'; }).join('') +
            '<tr><td>Inventario (hoy)</td><td>' + (VER_COSTOS ? fmtK(bal.inv) : '—') + '</td><td></td><td></td></tr><tr><td>Cuentas por cobrar (hoy)</td><td>' + fmtK(bal.cxc) + '</td><td></td><td></td></tr><tr><td>Cuentas por pagar (hoy)</td><td>' + fmtK(bal.cxp) + '</td><td></td><td></td></tr>' +
            '</tbody></table></div>';
    } else {
        var pct = function (v) { return a.netas ? nk.num(v / a.netas * 100, 1) + '%' : '—'; };
        var cats = Object.keys(a.porCat).sort(function (x, y) { return a.porCat[y] - a.porCat[x]; });
        $('fn-cuerpo').innerHTML = '<div class="nk-table-wrap"><table class="fn-tbl"><thead><tr><th>Estado de resultados · ' + nk.esc(etA) + '</th><th>USD</th>' + (TASA ? '<th>Bs (tasa de hoy)</th>' : '') + '<th>% de ventas</th></tr></thead><tbody>' +
            [['Ventas brutas', a.bruto], ['(−) Devoluciones', -a.dev, 'sub'], ['(−) IVA cobrado', -a.iva, 'sub'], ['Ventas netas', a.netas, 't']]
                .concat(VER_COSTOS ? [['(−) Costo de ventas', -a.costo, 'sub'], ['Utilidad bruta', a.utilBruta, 't']] : [])
                .concat([['(−) Gastos operativos', -a.gastos]]).concat(cats.map(function (c) { return ['· ' + c, -a.porCat[c], 'sub']; }))
                .concat(VER_COSTOS ? [['Utilidad neta', a.neta, 't']] : [])
                .map(function (r) { return '<tr class="' + (r[2] === 't' ? 'fn-t' : r[2] === 'sub' ? 'fn-sub' : '') + '"><td>' + nk.esc(r[0]) + '</td><td class="' + (r[1] < 0 ? 'fn-down' : '') + '">' + nk.usd(r[1]) + '</td>' + (TASA ? '<td>' + nk.bs(r[1] * TASA) + '</td>' : '') + '<td>' + pct(r[1]) + '</td></tr>'; }).join('') +
            '</tbody></table></div><p class="pf-hint">Las ventas se toman en dólares al momento de facturar. Los gastos se toman de Tesorería → Gastos.</p>';
    }
}
document.querySelectorAll('.nk-tab[data-t]').forEach(function (b) { b.addEventListener('click', function () { document.querySelectorAll('.nk-tab[data-t]').forEach(function (x) { x.classList.toggle('active', x === b); }); TAB = b.dataset.t; cargar(); }); });
async function iniciar() {
    TIENDAS = await nk.cargarTiendas();
    var c = await supabaseClient.from('configuracion').select('tasa_bcv_manual').limit(1).maybeSingle();
    TASA = c && c.data ? Number(c.data.tasa_bcv_manual) || 0 : 0;
    $('fn-suc').innerHTML = (nk.esAdmin() ? '<option value="todas">Todas las tiendas</option>' : '') + TIENDAS.map(function (t) { return '<option value="' + nk.esc(t.id) + '">' + nk.esc(t.nombre) + '</option>'; }).join('');
    $('fn-suc').value = nk.esAdmin() ? 'todas' : nk.suc().id;
    if (!nk.esAdmin()) $('fn-suc').disabled = true;
    $('fn-per').addEventListener('change', cargar); $('fn-suc').addEventListener('change', cargar);
    cargar();
}
if (U) iniciar();

</script>
