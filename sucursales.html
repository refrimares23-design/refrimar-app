<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sucursales - Refrimar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar / Menú Lateral -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between">
            <div class="p-4">
                <h1 class="text-xl font-bold tracking-wider mb-6 text-blue-400">REFRIMAR APP</h1>
                <nav class="space-y-2">
                    <a href="index.html" class="flex items-center space-x-3 p-2 rounded hover:bg-slate-800 text-gray-300">
                        <i class="fas fa-chart-line w-6"></i><span>Dashboard</span>
                    </a>
                    <a href="inventario.html" class="flex items-center space-x-3 p-2 rounded hover:bg-slate-800 text-gray-300">
                        <i class="fas fa-boxes w-6"></i><span>Inventario</span>
                    </a>
                    <a href="facturacion.html" class="flex items-center space-x-3 p-2 rounded hover:bg-slate-800 text-gray-300">
                        <i class="fas fa-file-invoice-dollar w-6"></i><span>Facturación</span>
                    </a>
                    <a href="sucursales.html" class="flex items-center space-x-3 p-2 rounded bg-blue-600 text-white">
                        <i class="fas fa-store w-6"></i><span>Sucursales</span>
                    </a>
                    <a href="configuracion.html" class="flex items-center space-x-3 p-2 rounded hover:bg-slate-800 text-gray-300">
                        <i class="fas fa-cog w-6"></i><span>Configuración</span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800">
                <a href="login.html" class="flex items-center space-x-3 text-red-400 hover:text-red-300">
                    <i class="fas fa-sign-out-alt w-6"></i><span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Gestión de Sucursales</h2>
                    <p class="text-gray-600 text-sm">Administra las ubicaciones y puntos de venta de Refrimar.</p>
                </div>
                <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow">
                    <i class="fas fa-plus"></i> Nueva Sucursal
                </button>
            </header>

            <!-- Tabla de Sucursales -->
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4 font-semibold text-gray-600">Nombre</th>
                            <th class="p-4 font-semibold text-gray-600">Dirección</th>
                            <th class="p-4 font-semibold text-gray-600">Teléfono</th>
                            <th class="p-4 font-semibold text-gray-600">Estado</th>
                            <th class="p-4 font-semibold text-gray-600 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-sucursales">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">Cargando sucursales...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Agregar/Editar -->
    <div id="modal-sucursal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modal-titulo" class="text-xl font-bold mb-4">Nueva Sucursal</h3>
            <form id="form-sucursal" onsubmit="guardarSucursal(event)" class="space-y-4">
                <input type="hidden" id="sucursal-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre</label>
                    <input type="text" id="nombre" required class="w-full border rounded-lg p-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Dirección</label>
                    <input type="text" id="direccion" required class="w-full border rounded-lg p-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Teléfono</label>
                    <input type="text" id="telefono" class="w-full border rounded-lg p-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts de Supabase y Lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="sucursales.js"></script>
</body>
</html>
