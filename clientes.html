</head>
<body class="bg-background text-on-background min-h-screen">
<div id="toast-container" class="toast-container"></div>
<div id="sidebar-overlay" class="overlay fixed inset-0 bg-black/50 z-30 lg:hidden" onclick="toggleSidebar()"></div>
<button onclick="toggleSidebar()" class="fixed top-4 left-4 z-50 lg:hidden bg-primary text-white p-2 rounded-lg shadow-lg"><span class="material-symbols-outlined">menu</span></button>
<div data-sucursal-badge-mobile class="fixed top-4 right-4 z-50 lg:hidden"></div>
<div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar-desktop fixed left-0 top-0 h-screen w-[280px] bg-surface flex flex-col p-md gap-sm z-40 lg:translate-x-0">
        <div class="mb-lg px-sm flex items-center justify-between">
            <div>
                <div class="text-2xl font-black text-primary tracking-tighter">REFRIMAR</div>
            </div>

        </div>
        <div id="user-badge" class="hidden-modal"><div id="user-name">-</div><div id="user-rol">-</div></div>
        <div data-sucursal-badge class="mx-sm mb-2"></div>
        <nav class="flex flex-col gap-xs flex-1 overflow-y-auto"></nav>
        <div class="mx-sm my-2 h-px bg-outline-variant/40 shrink-0"></div>
        <button id="logout-btn" class="w-full py-3 rounded-lg flex items-center gap-2 text-sm"><span class="material-symbols-outlined">logout</span>Cerrar sesión</button>
    </aside>
    <main class="flex-1 ml-[280px] lg:ml-[280px] main-content p-4 md:p-lg min-w-0">
        <header class="hidden"><h1>Clientes</h1></header>
        <div class="nk-page-head">
            <div>
                <h1>Clientes</h1>
                <p>Fichas de clientes, crédito y segmentos de compra (RFM): quién compra seguido, quién gasta más y quién dejó de venir.</p>
            </div>
            <div class="nk-actions">
                <button id="btn-exportar" class="nk-btn nk-btn-outline"><span class="material-symbols-outlined">download</span>Exportar</button>
                <button id="btn-nuevo" class="nk-btn"><span class="material-symbols-outlined">add</span>Nuevo</button>
            </div>
        </div>
        <div class="nk-kpis">
            <div class="nk-kpi"><b id="k-total">0</b><span>Clientes</span></div>
            <div class="nk-kpi"><b id="k-activos">0</b><span>Compraron este año</span></div>
            <div class="nk-kpi"><b id="k-campeones">0</b><span>Campeones y leales</span></div>
            <div class="nk-kpi" data-can="ver_cxc"><b id="k-saldo">$0,00</b><span>Saldo pendiente total</span></div>
        </div>
        <div id="tabla"></div>
    </main>
</div>
<script src="supabase-config.js"></script>
<script src="auth-session.js"></script>
<script src="sucursal-selector.js"></script>
<script src="offline-manager.js"></script>
<script src="js/nk-ui.js"></script>
<script>
var U = nk.boot();
var VER_CXC = window.can('ver_cxc');
var CLIENTES = [];
var SEG = {
    campeon: ['Campeón', 'nk-b-green'], leal: ['Leal', 'nk-b-blue'], valioso: ['Valioso', 'nk-b-violet'], potencial: ['Potencial', 'nk-b-blue'],
    reciente: ['Reciente', 'nk-b-green'], atencion: ['Atención', 'nk-b-amber'], dormido: ['Dormido', 'nk-b-amber'], perdido: ['Perdido', 'nk-b-red'], sin_compras: ['Sin compras', 'nk-b-gray']
};
var TIPOS = { final: 'Consumidor final', juridico: 'Jurídico', distribuidor: 'Distribuidor' };
var TIPODOC = { V: 'Cédula (V)', E: 'Extranjero (E)', J: 'RIF Jurídico (J)', G: 'Gobierno (G)', P: 'Pasaporte (P)' };
function segBadge(k) { var s = SEG[k] || SEG.sin_compras; return '<span class="nk-badge ' + s[1] + '">' + s[0] + '</span>'; }
function tipoDoc(rif) { var l = String(rif || '').trim().charAt(0).toUpperCase(); return TIPODOC[l] ? l : ''; }

function tabsRFM() {
    return [{ key: 'todo', label: 'Todo' }].concat(['perdido', 'dormido', 'reciente', 'atencion', 'potencial', 'valioso', 'leal', 'campeon', 'sin_compras'].map(function (k) {
        return { key: k, label: SEG[k][0], test: function (c) { return c.seg === k; } };
    }));
}

var tabla = nk.table({
    el: '#tabla',
    pageSize: 25,
    placeholder: 'Buscar por nombre, documento o teléfono',
    tabs: tabsRFM(),
    search: function (c) { return [c.nombre, c.rif, c.telefono, c.email].join(' '); },
    filters: [
        { key: 'doc', label: 'Tipo documento', options: Object.keys(TIPODOC).map(function (k) { return { value: k, label: TIPODOC[k] }; }), test: function (c, v) { return tipoDoc(c.rif) === v; } },
        { key: 'tipo', label: 'Tipo de cliente', options: Object.keys(TIPOS).map(function (k) { return { value: k, label: TIPOS[k] }; }), test: function (c, v) { return (c.tipo || 'final') === v; } }
    ].concat(VER_CXC ? [{ key: 'deuda', label: 'Crédito', options: [{ value: 'si', label: 'Con deuda' }, { value: 'no', label: 'Sin deuda' }], test: function (c, v) { return v === 'si' ? Number(c.saldo_pendiente) > 0 : !(Number(c.saldo_pendiente) > 0); } }] : []),
    columns: [
        { label: 'Documento', render: function (c) { return nk.esc(c.rif || '-'); } },
        { label: 'Tipo documento', render: function (c) { return nk.esc(TIPODOC[tipoDoc(c.rif)] || '-'); } },
        { label: 'Nombre', render: function (c) { return '<b style="font-weight:500">' + nk.esc(c.nombre) + '</b><span class="nk-sub">' + nk.esc(TIPOS[c.tipo || 'final'] || '') + '</span>'; } },
        { label: 'Teléfono', render: function (c) { return nk.esc(c.telefono || '-'); } },
        { label: 'RFM', render: function (c) { return segBadge(c.seg); } },
        { label: 'Última compra', render: function (c) { return c.ultima ? nk.fecha(c.ultima) : '-'; } },
        { label: 'Ventas totales', cls: 'r', render: function (c) { return nk.num(c.monto); } },
        { label: 'Total de facturas', cls: 'r', render: function (c) { return c.facturas; } }
    ].concat(VER_CXC ? [{ label: 'Saldo', cls: 'r', render: function (c) { var s = Number(c.saldo_pendiente) || 0; return s > 0 ? '<span class="nk-dif-neg">' + nk.usd(s) + '</span>' : '<span class="nk-hint">$0,00</span>'; } }] : []),
    onRow: detalle,
    empty: { title: 'No hay clientes', sub: 'Crea uno con el botón Nuevo o desde el POS.' }
});

function calcularRFM(clientes, ventas) {
    var por = {};
    var ahora = Date.now();
    ventas.forEach(function (v) {
        var k = String(v.cliente_rif || '').trim().toUpperCase(); if (!k) return;
        var x = por[k] || (por[k] = { n: 0, m: 0, ult: null });
        x.n++; x.m += (Number(v.total_usd) || 0) - (Number(v.total_devuelto_usd) || 0);
        if (!x.ult || v.created_at > x.ult) x.ult = v.created_at;
    });
    var montos = Object.keys(por).map(function (k) { return por[k].m; }).sort(function (a, b) { return a - b; });
    function quintil(m) { if (!montos.length) return 1; var i = montos.findIndex(function (x) { return x >= m; }); var p = (i < 0 ? montos.length : i + 1) / montos.length; return Math.max(1, Math.ceil(p * 5)); }
    clientes.forEach(function (c) {
        var x = por[String(c.rif || '').trim().toUpperCase()];
        if (!x) { c.seg = 'sin_compras'; c.facturas = 0; c.monto = 0; c.ultima = null; return; }
        var dias = (ahora - new Date(x.ult).getTime()) / 86400000;
        var R = dias <= 30 ? 5 : dias <= 60 ? 4 : dias <= 120 ? 3 : dias <= 240 ? 2 : 1;
        var F = x.n >= 12 ? 5 : x.n >= 6 ? 4 : x.n >= 3 ? 3 : x.n >= 2 ? 2 : 1;
        var M = quintil(x.m);
        c.facturas = x.n; c.monto = x.m; c.ultima = x.ult;
        c.seg = (R >= 4 && F >= 4 && M >= 4) ? 'campeon' : (F >= 4 && R >= 3) ? 'leal' : (M >= 4 && R >= 3) ? 'valioso'
            : (R >= 4 && F <= 1) ? 'reciente' : (R >= 3) ? 'potencial' : (R === 2 && (F >= 2 || M >= 3)) ? 'atencion' : (R === 2) ? 'dormido' : 'perdido';
    });
}

async function cargar() {
    tabla.setLoading();
    var crearQ = function () { return supabaseClient.from('clientes').select('*').order('nombre'); };
    var rc = nk.esAdmin() ? await crearQ() : await window.selectPorSucursal(crearQ, { nullEnTodas: true });
    if (rc.error) { nk.toast(nk.errMsg(rc.error), 'error'); tabla.setRows([]); return; }
    var desde = new Date(Date.now() - 365 * 86400000).toISOString();
    var ventas = [], from = 0;
    while (from < 20000) {
        var q = supabaseClient.from('ventas').select('cliente_rif,total_usd,total_devuelto_usd,created_at').eq('estado', 'completada').gte('created_at', desde).range(from, from + 999);
        if (!nk.esAdmin()) q = nk.porSucursal(q);
        var rv = await q;
        if (rv.error) {
            // si la columna de devoluciones aún no existe, repetir sin ella
            if (/total_devuelto_usd/.test(rv.error.message || '')) { q = supabaseClient.from('ventas').select('cliente_rif,total_usd,created_at').eq('estado', 'completada').gte('created_at', desde).range(from, from + 999); if (!nk.esAdmin()) q = nk.porSucursal(q); rv = await q; }
            if (rv.error) break;
        }
        ventas = ventas.concat(rv.data || []);
        if (!rv.data || rv.data.length < 1000) break;
        from += 1000;
    }
    CLIENTES = rc.data || [];
    calcularRFM(CLIENTES, ventas);
    document.getElementById('k-total').textContent = CLIENTES.length;
    document.getElementById('k-activos').textContent = CLIENTES.filter(function (c) { return c.facturas > 0; }).length;
    document.getElementById('k-campeones').textContent = CLIENTES.filter(function (c) { return c.seg === 'campeon' || c.seg === 'leal'; }).length;
    var ks = document.getElementById('k-saldo'); if (ks) ks.textContent = nk.usd(CLIENTES.reduce(function (s, c) { return s + (Number(c.saldo_pendiente) || 0); }, 0));
    tabla.setRows(CLIENTES);
}

function formulario(c) {
    var nuevo = !c; c = c || { tipo: 'final', limite_credito: 0 };
    var m = nk.modal({
        title: nuevo ? 'Nuevo cliente' : 'Editar cliente',
        body: '<label class="nk-field"><span>Nombre o razón social *</span><input id="c-nombre" class="nk-input" value="' + nk.esc(c.nombre || '') + '"/></label>' +
            '<div class="nk-grid2"><label class="nk-field"><span>Documento (V-12345678 / J-12345678-9)</span><input id="c-rif" class="nk-input" value="' + nk.esc(c.rif || '') + '" placeholder="V-00000000"/></label>' +
            '<label class="nk-field"><span>Teléfono</span><input id="c-tel" class="nk-input" value="' + nk.esc(c.telefono || '') + '"/></label>' +
            '<label class="nk-field"><span>Correo</span><input id="c-email" type="email" class="nk-input" value="' + nk.esc(c.email || '') + '"/></label>' +
            '<label class="nk-field"><span>Tipo de cliente</span><select id="c-tipo" class="nk-input">' + Object.keys(TIPOS).map(function (k) { return '<option value="' + k + '"' + ((c.tipo || 'final') === k ? ' selected' : '') + '>' + TIPOS[k] + '</option>'; }).join('') + '</select></label></div>' +
            '<label class="nk-field"><span>Dirección</span><input id="c-dir" class="nk-input" value="' + nk.esc(c.direccion || '') + '"/></label>' +
            (VER_CXC ? '<label class="nk-field"><span>Límite de crédito $ (0 = sin límite)</span><input id="c-lim" type="number" min="0" step="0.01" class="nk-input" value="' + (Number(c.limite_credito) || 0) + '"/></label>' : '') +
            '<label class="nk-field"><span>Notas</span><textarea id="c-notas" class="nk-input">' + nk.esc(c.notas || '') + '</textarea></label>',
        footer: '<button class="nk-btn" data-a="ok"><span class="material-symbols-outlined">save</span>Guardar</button>'
    });
    m.$('[data-a="ok"]').addEventListener('click', function (e) {
        var nombre = m.$('#c-nombre').value.trim();
        if (!nombre) { nk.toast('El nombre es obligatorio', 'warning'); return; }
        var rif = m.$('#c-rif').value.trim().toUpperCase().replace(/\s+/g, '');
        if (rif && /^[VEJGP]\d/.test(rif)) rif = rif.charAt(0) + '-' + rif.slice(1);
        if (rif && CLIENTES.some(function (x) { return x.id !== c.id && String(x.rif || '').toUpperCase() === rif; })) { nk.toast('Ya existe un cliente con ese documento', 'error'); return; }
        nk.busy(e.currentTarget, async function () {
            var lim = m.$('#c-lim');
            var r = await window.rpcConFallback('cliente_guardar', {
                p_id: nuevo ? null : c.id, p_nombre: nombre, p_rif: rif || null, p_telefono: m.$('#c-tel').value.trim() || null,
                p_email: m.$('#c-email').value.trim() || null, p_direccion: m.$('#c-dir').value.trim() || null, p_tipo: m.$('#c-tipo').value,
                p_limite_credito: lim ? (Number(lim.value) || 0) : (Number(c.limite_credito) || 0), p_notas: m.$('#c-notas').value.trim() || null,
                p_sucursal_id: nk.suc().id
            }, ['p_sucursal_id']);
            if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
            nk.toast(nuevo ? 'Cliente creado' : 'Cliente actualizado', 'success'); m.close(); cargar();
        });
    });
}
document.getElementById('btn-nuevo').addEventListener('click', function () { formulario(null); });

async function detalle(c) {
    var q = supabaseClient.from('ventas').select('numero,created_at,metodo_pago,total_usd,estado,sucursal_nombre').eq('cliente_rif', c.rif || '__sin_rif__').order('created_at', { ascending: false }).limit(200);
    if (!nk.esAdmin()) q = nk.porSucursal(q);
    var r = await q;
    var ventas = r.data || [];
    var btns = '<button class="nk-btn nk-btn-ghost" data-a="editar"><span class="material-symbols-outlined">edit</span>Editar</button>';
    if (VER_CXC && Number(c.saldo_pendiente) > 0) btns += '<button class="nk-btn nk-btn-outline" data-a="abono"><span class="material-symbols-outlined">payments</span>Registrar abono</button>';
    if (nk.esAdmin()) btns += '<button class="nk-btn nk-btn-danger" data-a="borrar"><span class="material-symbols-outlined">delete</span>Eliminar</button>';
    var m = nk.modal({
        title: c.nombre, wide: true,
        body: '<div class="nk-grid2" style="margin-bottom:12px"><div><span class="nk-sub">Documento</span>' + nk.esc(c.rif || '-') + '</div><div><span class="nk-sub">Segmento</span>' + segBadge(c.seg) + '</div>' +
            '<div><span class="nk-sub">Teléfono</span>' + nk.esc(c.telefono || '-') + '</div><div><span class="nk-sub">Correo</span>' + nk.esc(c.email || '-') + '</div>' +
            '<div><span class="nk-sub">Compras (12 meses)</span>' + c.facturas + ' facturas · ' + nk.usd(c.monto) + '</div>' +
            (VER_CXC ? '<div><span class="nk-sub">Saldo pendiente / límite</span>' + nk.usd(c.saldo_pendiente) + ' / ' + (Number(c.limite_credito) > 0 ? nk.usd(c.limite_credito) : 'sin límite') + '</div>' : '') +
            '<div style="grid-column:1/-1"><span class="nk-sub">Dirección</span>' + nk.esc(c.direccion || '-') + '</div></div>' +
            '<div style="font-family:Poppins;font-size:16px;margin-bottom:6px">Historial de compras</div>' +
            '<div class="nk-table-wrap" style="max-height:320px;overflow:auto"><table class="nk-table"><thead><tr><th>Factura</th><th>Fecha</th><th>Método</th><th>Tienda</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>' +
            (ventas.length ? ventas.map(function (v) { return '<tr><td><b>' + nk.esc(v.numero || '-') + '</b></td><td>' + nk.fechaHora(v.created_at) + '</td><td>' + nk.esc(v.metodo_pago || '-') + '</td><td>' + nk.esc(v.sucursal_nombre || 'Casa Matriz') + '</td><td class="r">' + nk.usd(v.total_usd) + '</td><td>' + nk.badge(v.estado) + '</td></tr>'; }).join('')
                : '<tr><td colspan="6" class="nk-hint">Sin compras registradas con este documento.</td></tr>') + '</tbody></table></div>',
        footer: btns
    });
    m.$('[data-a="editar"]').addEventListener('click', function () { m.close(); formulario(c); });
    var ba = m.$('[data-a="abono"]');
    if (ba) ba.addEventListener('click', function () { m.close(); abono(c); });
    var bb = m.$('[data-a="borrar"]');
    if (bb) bb.addEventListener('click', function (e) {
        if (Number(c.saldo_pendiente) > 0) { nk.toast('No se puede eliminar: el cliente tiene deuda pendiente', 'error'); return; }
        if (!confirm('¿Eliminar a ' + c.nombre + '? Sus facturas se conservan.')) return;
        nk.busy(e.currentTarget, async function () {
            var r = await supabaseClient.rpc('cliente_eliminar', { p_id: c.id });
            if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
            nk.toast('Cliente eliminado', 'success'); m.close(); cargar();
        });
    });
}

function abono(c) {
    var saldo = Number(c.saldo_pendiente) || 0;
    var m = nk.modal({
        title: 'Abono de ' + c.nombre,
        body: '<div class="nk-info" style="margin-bottom:12px">Saldo pendiente: <b>' + nk.usd(saldo) + '</b>. El abono entra a la caja de ' + nk.esc(nk.suc().nombre) + '.</div>' +
            '<label class="nk-field"><span>Monto del abono $</span><input id="a-monto" type="number" min="0.01" step="0.01" class="nk-input" value="' + saldo.toFixed(2) + '"/></label>' +
            '<p class="nk-hint">Para abonar a una factura específica usa <a href="cuentas_por_cobrar.html" style="text-decoration:underline">Cuentas por cobrar</a>.</p>',
        footer: '<button class="nk-btn" data-a="ok"><span class="material-symbols-outlined">payments</span>Registrar abono</button>'
    });
    m.$('[data-a="ok"]').addEventListener('click', function (e) {
        var monto = Number(m.$('#a-monto').value) || 0;
        if (monto <= 0) { nk.toast('Monto inválido', 'warning'); return; }
        if (monto > saldo + 0.005) { nk.toast('El abono no puede ser mayor al saldo (' + nk.usd(saldo) + ')', 'error'); return; }
        nk.busy(e.currentTarget, async function () {
            var r = await supabaseClient.rpc('cliente_registrar_abono', { p_cliente_id: c.id, p_monto: monto, p_sucursal_id: nk.suc().id, p_usuario: U.nombre });
            if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
            nk.toast('Abono registrado', 'success'); m.close(); cargar();
        });
    });
}

document.getElementById('btn-exportar').addEventListener('click', function () {
    var rows = [['Documento', 'Nombre', 'Telefono', 'Correo', 'Tipo', 'Segmento', 'Ultima compra', 'Ventas 12m', 'Facturas'].concat(VER_CXC ? ['Saldo'] : [])].concat(CLIENTES.map(function (c) {
        return [c.rif || '', c.nombre, c.telefono || '', c.email || '', TIPOS[c.tipo || 'final'] || '', (SEG[c.seg] || SEG.sin_compras)[0], c.ultima ? nk.fecha(c.ultima) : '', Number(c.monto || 0).toFixed(2), c.facturas].concat(VER_CXC ? [Number(c.saldo_pendiente || 0).toFixed(2)] : []);
    }));
    var csv = '﻿' + rows.map(function (x) { return x.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
