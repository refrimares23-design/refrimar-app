    .bk-card:hover { border-color: var(--nk-orange); box-shadow: 0 6px 18px rgba(0,0,0,.05); }

<script>
var U = nk.boot();
var CUENTAS = [], TASA = 0;
var COLORES = ['#FFE4CC', '#E0F2FE', '#DCFCE7', '#F3E8FF', '#FEF9C3', '#FCE7F3'];
function ini(b) { return String(b || '?').split(/\s+/).filter(function (x) { return x.length > 2 || /^\d/.test(x); }).map(function (x) { return x[0]; }).join('').slice(0, 2).toUpperCase() || String(b).slice(0, 2).toUpperCase(); }
function fmtMonto(v, mon) { return mon === 'USD' ? nk.usd(v) : Number(v || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
async function cargar() {
    var r = await supabaseClient.from('cuentas_bancarias').select('*').eq('activa', true).order('banco');
    if (r.error) { document.getElementById('bk-lista').innerHTML = '<div class="nk-empty-ill"><span class="material-symbols-outlined">account_balance</span><b>Falta activar Bancos</b><span>Corre en Supabase el archivo supabase-migration-norkut-fase3.sql</span></div>'; return; }
    CUENTAS = r.data || [];
    var c = await supabaseClient.from('configuracion').select('tasa_bcv_manual').limit(1).maybeSingle();
    TASA = c && c.data ? Number(c.data.tasa_bcv_manual) || 0 : 0;
    var ves = CUENTAS.filter(function (x) { return x.moneda === 'VES'; }).reduce(function (s, x) { return s + Number(x.saldo); }, 0);
    var usd = CUENTAS.filter(function (x) { return x.moneda === 'USD'; }).reduce(function (s, x) { return s + Number(x.saldo); }, 0);
    document.getElementById('bk-tot').innerHTML = CUENTAS.length ? '<div><b>' + fmtMonto(ves, 'VES') + ' VES</b>Total en bolívares</div><div><b>' + nk.usd(usd) + '</b>Total en dólares</div>' + (TASA ? '<div><b>' + nk.usd(usd + ves / TASA) + '</b>Total equivalente en $ (tasa ' + nk.num(TASA, 2) + ')</div>' : '') : '';
    if (!CUENTAS.length) { document.getElementById('bk-lista').innerHTML = '<div class="nk-empty-ill"><span class="material-symbols-outlined">account_balance</span><b>Aún no hay cuentas</b><span>Registra tus cuentas de banco, efectivo o Zelle para llevar sus saldos.</span></div>'; return; }
    var grupos = {};
    CUENTAS.forEach(function (x) { (grupos[x.banco] = grupos[x.banco] || []).push(x); });
    document.getElementById('bk-lista').innerHTML = Object.keys(grupos).map(function (b, gi) {
        return '<div class="bk-grupo"><div class="bk-gh"><span class="bk-av" style="background:' + COLORES[gi % COLORES.length] + '">' + nk.esc(ini(b)) + '</span>' + nk.esc(b) + '</div><div class="bk-cards">' +
            grupos[b].map(function (x) {
                return '<div class="bk-card" data-id="' + nk.esc(x.id) + '"><div class="bk-ct"><div><b>' + fmtMonto(x.saldo, x.moneda) + '</b><div class="bk-alias">' + nk.esc(x.alias) + (x.por_defecto ? '<span class="bk-def">Por defecto</span>' : '') + '</div></div><span class="bk-mon' + (x.moneda === 'USD' ? ' usd' : '') + '">' + x.moneda + '</span></div>' +
                    '<div class="bk-num">Número de cuenta<span>' + nk.esc(x.numero || '—') + (x.numero ? '<button type="button" data-copy="' + nk.esc(x.numero) + '" title="Copiar"><span class="material-symbols-outlined">content_copy</span></button>' : '') + '</span></div>' +
                    '<div class="bk-met">Métodos de pago<div>' + ((x.metodos || []).length ? x.metodos.map(function (m) { return '<i>' + nk.esc(m) + '</i>'; }).join('') : '<span>No hay métodos de pago asociados</span>') + '</div></div></div>';
            }).join('') + '</div></div>';
    }).join('');
    document.querySelectorAll('[data-copy]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); try { navigator.clipboard.writeText(b.dataset.copy); nk.toast('Número copiado', 'success'); } catch (x) {} }); });
    document.querySelectorAll('.bk-card').forEach(function (cd) { cd.addEventListener('click', function () { detalle(CUENTAS.find(function (x) { return x.id === cd.dataset.id; })); }); });
}
function opcionesCuentas(sel) { return '<option value="">Selecciona…</option>' + CUENTAS.map(function (x) { return '<option value="' + nk.esc(x.id) + '"' + (sel === x.id ? ' selected' : '') + '>' + nk.esc(x.banco + ' · ' + x.alias) + ' (' + x.moneda + ')</option>'; }).join(''); }
document.getElementById('bk-transf').addEventListener('click', function () { transferir(); });
function transferir(origen) {
    if (CUENTAS.length < 2) { nk.toast('Necesitas al menos dos cuentas para transferir', 'warning'); return; }
    var m = nk.modal({
        title: 'Transferencia bancaria',
        body: '<div class="nk-grid2"><label class="nk-field"><span>Banco origen*</span><select id="t-o" class="nk-input">' + opcionesCuentas(origen) + '</select></label><label class="nk-field"><span>Banco destino*</span><select id="t-d" class="nk-input">' + opcionesCuentas() + '</select></label>' +
            '<label class="nk-field"><span>Fecha*</span><input id="t-f" type="date" class="nk-input" value="' + nk.hoyISO() + '"/></label><label class="nk-field"><span>Monto*</span><input id="t-m" type="number" min="0" step="0.01" class="nk-input" placeholder="Ingresa monto"/></label></div>' +
            '<label class="nk-field" id="t-md-w" style="display:none"><span>Monto que llega al destino (otra moneda)*</span><input id="t-md" type="number" min="0" step="0.01" class="nk-input"/><small class="nk-hint" id="t-md-h"></small></label>' +
            '<label class="nk-field"><span>Motivo</span><textarea id="t-mo" class="pf-ta" placeholder="Ingresa motivo" maxlength="200"></textarea></label>',
        footer: '<button class="nk-btn nk-btn-outline" data-a="no">Salir</button><button class="nk-btn" data-a="ok">Guardar</button>'
    });
    function monedas() {
        var o = CUENTAS.find(function (x) { return x.id === m.$('#t-o').value; }), d = CUENTAS.find(function (x) { return x.id === m.$('#t-d').value; });
        var dif = o && d && o.moneda !== d.moneda;
        m.$('#t-md-w').style.display = dif ? '' : 'none';
        if (dif && TASA) { var v = Number(m.$('#t-m').value) || 0; m.$('#t-md').value = v ? (o.moneda === 'USD' ? v * TASA : v / TASA).toFixed(2) : ''; m.$('#t-md-h').textContent = 'Calculado con la tasa ' + nk.num(TASA, 2) + '. Puedes cambiarlo.'; }
    }
    ['#t-o', '#t-d', '#t-m'].forEach(function (s) { m.$(s).addEventListener('input', monedas); });
    m.$('[data-a="no"]').addEventListener('click', m.close);
    m.$('[data-a="ok"]').addEventListener('click', function (e) {
        var o = m.$('#t-o').value, d = m.$('#t-d').value, monto = Number(m.$('#t-m').value) || 0;
        if (!o || !d) { nk.toast('Elige banco origen y destino', 'warning'); return; }
        if (o === d) { nk.toast('Origen y destino deben ser cuentas distintas', 'warning'); return; }
        if (!(monto > 0)) { nk.toast('Ingresa el monto', 'warning'); return; }
        nk.busy(e.currentTarget, async function () {
            var r = await supabaseClient.rpc('cuenta_transferir', { p_origen: o, p_destino: d, p_fecha: m.$('#t-f').value || null, p_monto: monto, p_monto_destino: Number(m.$('#t-md').value) || null, p_motivo: m.$('#t-mo').value.trim(), p_usuario: U.nombre });
            if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
            nk.toast('Transferencia registrada', 'success'); m.close(); cargar();
        });
    });
}
async function detalle(c) {
    var m = nk.modal({
        title: c.banco + ' · ' + c.alias, wide: true,
        body: '<div class="nk-kpis" style="margin-bottom:12px"><div class="nk-kpi"><b>' + fmtMonto(c.saldo, c.moneda) + ' ' + c.moneda + '</b><span>Balance actual</span></div><div class="nk-kpi"><b style="font-size:15px">' + nk.esc(c.numero || '—') + '</b><span>Número de cuenta</span></div></div>' +
            '<div class="nk-actions" style="margin-bottom:12px"><button class="nk-btn nk-btn-outline nk-btn-sm" data-a="ing"><span class="material-symbols-outlined">add</span>Registrar ingreso</button><button class="nk-btn nk-btn-outline nk-btn-sm" data-a="egr"><span class="material-symbols-outlined">remove</span>Registrar egreso</button><button class="nk-btn nk-btn-outline nk-btn-sm" data-a="aj"><span class="material-symbols-outlined">tune</span>Ajustar saldo</button><button class="nk-btn nk-btn-outline nk-btn-sm" data-a="tr"><span class="material-symbols-outlined">sync_alt</span>Transferir</button><a class="nk-btn nk-btn-ghost nk-btn-sm" href="cuenta-form.html?id=' + encodeURIComponent(c.id) + '"><span class="material-symbols-outlined">edit</span>Editar</a></div>' +
            '<div id="mv"></div>'
    });
    var TIPOS = { saldo_inicial: 'Saldo inicial', ingreso: 'Ingreso', egreso: 'Egreso', ajuste: 'Ajuste', transferencia_salida: 'Transferencia enviada', transferencia_entrada: 'Transferencia recibida' };
    var t = nk.table({ el: m.$('#mv'), pageSize: 10, placeholder: 'Buscar movimiento',
        search: function (x) { return [x.motivo, x.referencia, x.usuario_nombre, TIPOS[x.tipo]].join(' '); },
        columns: [{ label: 'Fecha', render: function (x) { return nk.fecha(x.fecha) + '<span class="nk-sub">' + nk.hora(x.created_at) + '</span>'; } }, { label: 'Movimiento', render: function (x) { return nk.esc(TIPOS[x.tipo] || x.tipo) + '<span class="nk-sub">' + nk.esc(x.motivo || '') + '</span>'; } },
            { label: 'Monto', cls: 'r', render: function (x) { var v = Number(x.monto); return '<span class="' + (v < 0 ? 'nk-dif-neg' : 'nk-dif-pos') + '">' + (v < 0 ? '−' : '+') + fmtMonto(Math.abs(v), c.moneda) + '</span>'; } }, { label: 'Saldo', cls: 'r', render: function (x) { return fmtMonto(x.saldo_despues, c.moneda); } }, { label: 'Usuario', render: function (x) { return nk.esc(x.usuario_nombre || ''); } }],
        empty: { title: 'Sin movimientos', sub: '' } });
    t.setLoading();
    var r = await supabaseClient.from('cuenta_movimientos').select('*').eq('cuenta_id', c.id).order('created_at', { ascending: false }).limit(500);
    t.setRows((r && r.data) || []);
    function mov(tipo) {
        var titulo = { ingreso: 'Registrar ingreso', egreso: 'Registrar egreso', ajuste: 'Ajustar saldo (lo que hay realmente en la cuenta)' }[tipo];
        var m2 = nk.modal({ title: titulo, body: '<label class="nk-field"><span>' + (tipo === 'ajuste' ? 'Saldo real' : 'Monto') + ' (' + c.moneda + ')</span><input id="mv-m" type="number" step="0.01" class="nk-input"' + (tipo === 'ajuste' ? ' value="' + Number(c.saldo) + '"' : ' min="0"') + '/></label><label class="nk-field"><span>Fecha</span><input id="mv-f" type="date" class="nk-input" value="' + nk.hoyISO() + '"/></label><label class="nk-field"><span>Motivo</span><input id="mv-mo" class="nk-input" maxlength="200"/></label><label class="nk-field"><span>Referencia</span><input id="mv-r" class="nk-input" maxlength="60"/></label>', footer: '<button class="nk-btn" data-a="ok">Guardar</button>' });
        m2.$('[data-a="ok"]').addEventListener('click', function (e) {
            var v = Number(m2.$('#mv-m').value);
            if (isNaN(v) || (tipo !== 'ajuste' && !(v > 0))) { nk.toast('Ingresa un monto válido', 'warning'); return; }
            nk.busy(e.currentTarget, async function () {
                var x = await supabaseClient.rpc('cuenta_movimiento', { p_cuenta: c.id, p_tipo: tipo, p_monto: v, p_motivo: m2.$('#mv-mo').value.trim() || null, p_fecha: m2.$('#mv-f').value || null, p_referencia: m2.$('#mv-r').value.trim() || null, p_usuario: U.nombre });
                if (x.error) { nk.toast(nk.errMsg(x.error), 'error'); return; }
                nk.toast('Movimiento registrado', 'success'); m2.close(); m.close(); cargar();
            });
        });
    }
    m.$('[data-a="ing"]').addEventListener('click', function () { mov('ingreso'); });
    m.$('[data-a="egr"]').addEventListener('click', function () { mov('egreso'); });
    m.$('[data-a="aj"]').addEventListener('click', function () { mov('ajuste'); });
    m.$('[data-a="tr"]').addEventListener('click', function () { m.close(); transferir(c.id); });
}
document.getElementById('bk-imp').addEventListener('click', function () {
    var m = nk.modal({ title: 'Importar cuentas bancarias', body: '<p class="nk-hint" style="margin-bottom:8px">Sube un archivo Excel o CSV con las cuentas a importar.</p><p style="margin-bottom:10px"><button type="button" class="oc-link" id="ci-pl" style="color:var(--nk-orange-text)">Descargar plantilla <span class="material-symbols-outlined" style="font-size:15px;vertical-align:-3px">download</span></button></p><div class="pr-drop im-drop" id="ci-drop" style="min-height:150px"><span class="material-symbols-outlined">upload</span><b>Arrastra y suelta el archivo aquí</b><span>Formato XLSX, XLS o CSV</span></div><input type="file" id="ci-f" accept=".xlsx,.xls,.csv" style="display:none"/><div id="ci-prev" style="margin-top:10px"></div>', footer: '<button class="nk-btn nk-btn-outline" data-a="no">Cancelar</button><button class="nk-btn" data-a="ok" disabled>Siguiente</button>' });
    var FILAS = [];
    m.$('[data-a="no"]').addEventListener('click', m.close);
    m.$('#ci-pl').addEventListener('click', async function () {
        await nk.cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', function () { return !!window.XLSX; });
        var ws = XLSX.utils.aoa_to_sheet([['Banco', 'Alias', 'Número de cuenta', 'Moneda', 'Saldo actual', 'Métodos de pago'], ['Banco Plaza', 'Plaza principal', '01380003190030181623', 'VES', 0, 'Transferencia, Pago móvil'], ['Efectivo', 'Caja dólares', '', 'USD', 0, 'Efectivo']]);
        var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Cuentas'); XLSX.writeFile(wb, 'plantilla_cuentas.xlsx');
    });
    var drop = m.$('#ci-drop');
    drop.addEventListener('click', function () { m.$('#ci-f').click(); });
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('drag'); }); });
    async function leer(f) {
        await nk.cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', function () { return !!window.XLSX; });
        var wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        function g(r, keys) { var k = Object.keys(r).find(function (x) { var t = x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); return keys.some(function (y) { return t.indexOf(y) >= 0; }); }); return k ? String(r[k]).trim() : ''; }
        FILAS = rows.map(function (r) { return { banco: g(r, ['banco']), alias: g(r, ['alias', 'nombre']), numero: g(r, ['numero', 'cuenta']), moneda: /usd|\$|dolar/i.test(g(r, ['moneda'])) ? 'USD' : 'VES', saldo: Number(String(g(r, ['saldo', 'balance'])).replace(/\./g, '').replace(',', '.')) || 0, metodos: g(r, ['metodo']).split(/[,;\/]/).map(function (x) { return x.trim(); }).filter(Boolean) }; }).filter(function (x) { return x.banco; });
        FILAS.forEach(function (x) { if (!x.alias) x.alias = x.banco; });
        m.$('#ci-prev').innerHTML = '<div class="nk-info">' + FILAS.length + ' cuenta(s) encontradas en ' + nk.esc(f.name) + '</div>';
        m.$('[data-a="ok"]').disabled = !FILAS.length;
    }
    drop.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) leer(f); });
    m.$('#ci-f').addEventListener('change', function () { var f = this.files[0]; if (f) leer(f); });
    m.$('[data-a="ok"]').addEventListener('click', function (e) {
        nk.busy(e.currentTarget, async function () {
            var ok = 0;
            for (var i = 0; i < FILAS.length; i++) { var r = await supabaseClient.rpc('cuenta_guardar', { p_id: null, p_datos: FILAS[i], p_usuario: U.nombre }); if (!r.error) ok++; else nk.toast(FILAS[i].alias + ': ' + nk.errMsg(r.error), 'error'); }
            nk.toast(ok + ' cuenta(s) importadas', 'success'); m.close(); cargar();
        });
    });
});
if (U) cargar();

</script>
