<script src="supabase-config.js"></script>

<script>
var U = nk.boot();
var VER_COSTOS = window.can('ver_costos');
var $ = function (id) { return document.getElementById(id); };
var ID = new URLSearchParams(location.search).get('id');
var OC = null, PRODUCTOS = [], TIENDAS = [], PROVEEDORES = [], ITEMS = [], TASA = 0;
function prod(c) { return PRODUCTOS.find(function (p) { return p.codigo === c; }); }
function ivaDe(c) { var p = prod(c); return p && p.iva_tasa != null ? Number(p.iva_tasa) : 16; }
function totales() {
    var costos = 0, imp = 0;
    ITEMS.forEach(function (it) { var s = (Number(it.cantidad) || 0) * (Number(it.costo) || 0); costos += s; imp += s * ivaDe(it.codigo) / 100; });
    return { costos: Math.round(costos * 100) / 100, imp: Math.round(imp * 100) / 100, total: Math.round((costos + imp) * 100) / 100 };
}
function pintar() {
    var c = $('oc-items');
    if (!ITEMS.length) c.innerHTML = window.refEstado('vacio', 'Aún no hay productos', 'Agrega al menos un producto a la lista para poder realizar una orden correctamente.', '', 'sm');
    else {
        c.innerHTML = '<div class="nk-table-wrap"><table class="pf-tbl"><thead><tr><th>Producto</th><th class="r">Stock actual</th><th class="r">Cantidad</th><th class="r">Costo unit. $</th><th class="r">IVA</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>' +
            ITEMS.map(function (it, i) {
                var p = prod(it.codigo) || {};
                return '<tr><td><b style="font-weight:500">' + nk.esc(it.descripcion || p.descripcion) + '</b><span class="nk-sub">' + nk.esc(it.codigo) + '</span></td><td class="r">' + nk.qty(p.stock || 0) + '</td>' +
                    '<td class="r"><input class="pf-in pf-qty" type="number" min="0" step="any" data-k="cantidad" data-i="' + i + '" value="' + it.cantidad + '"/></td>' +
                    '<td class="r"><input class="pf-in pf-qty" type="number" min="0" step="0.01" data-k="costo" data-i="' + i + '" value="' + it.costo + '"/></td>' +
                    '<td class="r">' + ivaDe(it.codigo) + '%</td><td class="r">' + nk.usd((Number(it.cantidad) || 0) * (Number(it.costo) || 0)) + '</td>' +
                    '<td><button type="button" class="pf-back" data-del="' + i + '"><span class="material-symbols-outlined">delete</span></button></td></tr>';
            }).join('') + '</tbody></table></div>';
        c.querySelectorAll('[data-k]').forEach(function (inp) { inp.addEventListener('change', function () { ITEMS[Number(inp.dataset.i)][inp.dataset.k] = Math.max(0, Number(inp.value) || 0); pintar(); }); });
        c.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () { ITEMS.splice(Number(b.dataset.del), 1); pintar(); }); });
    }
    var t = totales(), bs = $('oc-mon').value === 'VES' && TASA;
    function f(v) { return nk.usd(v) + (bs ? '<small style="display:block;font-weight:400;color:#71717A;text-align:right">' + nk.bs(v * TASA) + '</small>' : ''); }
    $('oc-sum').innerHTML = '<div><span>Total costos</span><b>' + f(t.costos) + '</b></div><div><span>Total impuestos</span><b>' + f(t.imp) + '</b></div><div><span><b style="font-weight:500">Subtotal</b></span><b>' + f(t.costos) + '</b></div><div class="tot"><span>Total</span><b>' + f(t.total) + '</b></div>';
}
function agregar(p, cant, costo) {
    var ex = ITEMS.find(function (x) { return x.codigo === p.codigo; });
    if (ex) { ex.cantidad = (Number(ex.cantidad) || 0) + (cant || 1); if (costo != null) ex.costo = costo; }
    else ITEMS.push({ codigo: p.codigo, descripcion: p.descripcion, cantidad: cant || 1, costo: costo != null ? costo : Number(p.costo) || 0 });
    pintar();
}
nk.dropdown($('oc-dd'));
$('oc-mon').addEventListener('change', pintar);
$('oc-buscar').addEventListener('click', function () {
    nk.buscadorProductos({ productos: PRODUCTOS.filter(function (p) { return p.tipo_producto !== 'servicio'; }), extra: function (p) { return 'Stock ' + nk.qty(p.stock || 0) + (VER_COSTOS ? ' · ' + nk.usd(p.costo) : ''); }, onPick: function (p) { agregar(p, 1); } });
});
$('oc-imp').addEventListener('click', function () { $('oc-file').click(); });
$('oc-file').addEventListener('change', async function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    try {
        var rows = await nk.leerListaExcel(f), ok = 0, no = [];
        rows.forEach(function (r) { var p = PRODUCTOS.find(function (x) { return String(x.codigo).toLowerCase() === r.codigo.toLowerCase() || (x.codigos_alternos || []).some(function (a) { return String(a).toLowerCase() === r.codigo.toLowerCase(); }); }); if (p && r.cantidad > 0) { agregar(p, r.cantidad, r.costo); ok++; } else no.push(r.codigo); });
        nk.toast(ok + ' producto(s) agregados' + (no.length ? ' · ' + no.length + ' no encontrados' : ''), no.length ? 'warning' : 'success');
    } catch (e) { nk.toast('No se pudo leer el archivo: ' + (e.message || e), 'error'); }
});
$('oc-analizar').addEventListener('click', function () {
    var prov = $('oc-prov').value;
    var lista = PRODUCTOS.filter(function (p) { return p.tipo_producto !== 'servicio' && Number(p.stock_minimo) > 0 && (Number(p.stock) || 0) <= Number(p.stock_minimo) && (!prov || !(p.proveedores || []).length || (p.proveedores || []).indexOf(prov) >= 0); });
    if (!lista.length) { nk.toast('No hay productos bajo su stock mínimo' + (prov ? ' de este proveedor' : ''), 'info'); return; }
    var n = 0;
    lista.forEach(function (p) { if (!ITEMS.some(function (x) { return x.codigo === p.codigo; })) { var pedir = Math.max(1, Math.ceil(Number(p.stock_minimo) * 2 - (Number(p.stock) || 0))); agregar(p, pedir); n++; } });
    nk.toast(n + ' producto(s) sugeridos: los que están bajo su mínimo (se pide para llegar al doble del mínimo)', 'success');
});
$('oc-addprov').addEventListener('click', function () {
    var m = nk.modal({ title: 'Agregar proveedor', body: '<label class="nk-field"><span>Nombre o razón social *</span><input id="np-n" class="nk-input" maxlength="120"/></label><label class="nk-field"><span>RIF</span><input id="np-r" class="nk-input" placeholder="J-12345678-9" maxlength="20"/></label><label class="nk-field"><span>Teléfono</span><input id="np-t" class="nk-input" maxlength="30"/></label>', footer: '<button class="nk-btn" data-a="ok">Guardar</button>' });
    m.$('[data-a="ok"]').addEventListener('click', function (e) {
        var n = m.$('#np-n').value.trim(); if (!n) { nk.toast('Escribe el nombre', 'warning'); return; }
        nk.busy(e.currentTarget, async function () {
            var r = await supabaseClient.from('proveedores').insert({ nombre: n, rif: m.$('#np-r').value.trim() || null, telefono: m.$('#np-t').value.trim() || null }).select('id,nombre,rif');
            if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
            var nuevo = (r.data && r.data[0]) || null;
            await cargarProveedores();
            if (nuevo) $('oc-prov').value = nuevo.id;
            m.close(); nk.toast('Proveedor agregado', 'success');
        });
    });
});
async function cargarProveedores() {
    var r = await supabaseClient.from('proveedores').select('id,nombre,rif,telefono').order('nombre');
    PROVEEDORES = (r && r.data) || [];
    var v = $('oc-prov').value;
    $('oc-prov').innerHTML = '<option value="">Buscar proveedor*</option>' + PROVEEDORES.map(function (p) { return '<option value="' + nk.esc(p.id) + '">' + nk.esc(p.nombre) + (p.rif ? ' · ' + nk.esc(p.rif) : '') + '</option>'; }).join('');
    $('oc-prov').value = v;
}
$('oc-prov').addEventListener('change', function () { var p = PROVEEDORES.find(function (x) { return String(x.id) === this.value; }, this); if (p && p.telefono && !$('oc-contacto').value) $('oc-contacto').value = p.telefono; });
async function guardar(estado, btn) {
    var provId = $('oc-prov').value;
    if (!provId) { nk.toast('Selecciona el proveedor', 'warning'); return; }
    if (estado === 'ordenada' && (!$('oc-neg').value || !$('oc-mon').value || !$('oc-forma').value)) { nk.toast('Para ordenar completa tipo de negociación, moneda y forma de pago', 'warning'); return; }
    var validos = ITEMS.filter(function (it) { return Number(it.cantidad) > 0; });
    if (!validos.length) { nk.toast('Agrega al menos un producto con cantidad', 'warning'); return; }
    var prov = PROVEEDORES.find(function (p) { return String(p.id) === provId; });
    var dest = TIENDAS.find(function (s) { return s.id === $('oc-dest').value; }) || nk.suc();
    await nk.busy(btn, async function () {
        var r = await supabaseClient.rpc('oc_guardar', { p_id: OC ? OC.id : null, p_proveedor_id: provId, p_proveedor_nombre: prov ? prov.nombre : null,
            p_fecha_estimada: $('oc-fest').value || null, p_notas: $('oc-obs').value.trim() || null, p_sucursal_id: dest.id, p_sucursal_nombre: dest.nombre,
            p_usuario: U.nombre, p_estado: estado, p_items: validos.map(function (it) { return { codigo: it.codigo, cantidad: Number(it.cantidad), costo_unitario: Number(it.costo) || 0 }; }) });
        if (r.error) { nk.toast(nk.errMsg(r.error), 'error'); return; }
        var t = totales();
        var x = await supabaseClient.rpc('oc_extra_guardar', { p_id: r.data.id, p_extra: { tipo_negociacion: $('oc-neg').value, moneda_pago: $('oc-mon').value, forma_pago: $('oc-forma').value, contacto: $('oc-contacto').value,
            fecha_vencimiento: $('oc-fven').value, empresa_transporte: $('oc-emp').value, tracking: $('oc-track').value, referencia: $('oc-ref').value, total_impuestos: t.imp } });
        var aviso = x.error ? ' (para guardar negociación y transporte corre supabase-migration-norkut-fase3.sql)' : '';
        try { sessionStorage.setItem('refrimar_flash_info', 'Orden ' + r.data.numero + (estado === 'ordenada' ? ' ordenada' : ' guardada') + aviso); } catch (e) {}
        location.href = 'ordenes_compra.html';
    });
}
$('oc-guardar').addEventListener('click', function () { guardar(OC && OC.estado === 'ordenada' ? 'ordenada' : 'borrador', this); });
$('oc-ordenar').addEventListener('click', function () { guardar('ordenada', this); });
async function iniciar() {
    var res = await Promise.all([nk.cargarProductos('codigo,descripcion,costo,stock,stock_minimo,codigos_alternos,tipo_producto,iva_tasa,proveedores'), nk.cargarTiendas(), cargarProveedores(), supabaseClient.from('configuracion').select('tasa_bcv_manual').limit(1).maybeSingle()]);
    PRODUCTOS = res[0]; TIENDAS = res[1]; TASA = res[3] && res[3].data ? Number(res[3].data.tasa_bcv_manual) || 0 : 0;
    if (!PRODUCTOS.length || PRODUCTOS[0].iva_tasa === undefined) { PRODUCTOS = await nk.cargarProductos('codigo,descripcion,costo,stock,stock_minimo,codigos_alternos'); }
    $('oc-dest').innerHTML = TIENDAS.map(function (t) { return '<option value="' + nk.esc(t.id) + '">' + nk.esc(t.nombre) + '</option>'; }).join('');
    $('oc-dest').value = nk.suc().id;
    if (!nk.esAdmin()) $('oc-dest').disabled = true;
    if (ID) {
        var r = await supabaseClient.from('ordenes_compra').select('*').eq('id', ID).maybeSingle();
        if (r.error || !r.data) { nk.toast('No se encontró la orden', 'error'); return; }
        OC = r.data;
        if (['borrador', 'ordenada'].indexOf(OC.estado) < 0) { nk.toast('Esta orden ya no se puede editar (' + OC.estado + ')', 'warning'); setTimeout(function () { location.href = 'ordenes_compra.html'; }, 1200); return; }
        var d = await supabaseClient.from('compra_detalles').select('*').eq('compra_id', OC.id);
        ITEMS = ((d && d.data) || []).map(function (x) { return { codigo: x.producto_codigo, descripcion: x.descripcion, cantidad: Number(x.cantidad), costo: Number(x.costo_unitario) }; });
        $('oc-titulo').textContent = 'Orden de compra #' + OC.numero;
        $('oc-prov').value = OC.proveedor_id || ''; $('oc-dest').value = OC.sucursal_id || nk.CASA;
        $('oc-neg').value = OC.tipo_negociacion || ''; $('oc-mon').value = OC.moneda_pago || ''; $('oc-forma').value = OC.forma_pago || ''; $('oc-contacto').value = OC.contacto || '';
